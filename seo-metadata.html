<!--
  =============================================
  SEO METADATA FOR BLOGGER
  =============================================
  HOW TO ADD THIS TO YOUR BLOG:
  1. Go to Blogger Dashboard > Theme > Edit HTML
  2. Find the <head> tag
  3. Paste everything below right after <head>
  4. Replace all the placeholder values with your own info
  5. Save
  =============================================
-->

<!-- Basic SEO -->
<meta name='description' content='YOUR BLOG DESCRIPTION HERE — keep it under 160 characters.'/>
<meta name='keywords' content='keyword1, keyword2, keyword3'/>
<meta name='author' content='YOUR NAME'/>

<!-- Open Graph (controls how your link looks on Facebook, WhatsApp, etc.) -->
<meta property='og:type' content='website'/>
<meta property='og:site_name' content='YOUR BLOG NAME'/>
<meta property='og:title' content='YOUR BLOG NAME'/>
<meta property='og:description' content='YOUR BLOG DESCRIPTION HERE'/>
<meta property='og:url' content='https://YOURBLOG.blogspot.com'/>
<meta property='og:image' content='https://YOURBLOG.blogspot.com/YOUR-LOGO-IMAGE.png'/>

<!-- Twitter/X Card -->
<meta name='twitter:card' content='summary'/>
<meta name='twitter:title' content='YOUR BLOG NAME'/>
<meta name='twitter:description' content='YOUR BLOG DESCRIPTION HERE'/>
<meta name='twitter:image' content='https://YOURBLOG.blogspot.com/YOUR-LOGO-IMAGE.png'/>

<!-- Schema.org Structured Data (helps Google show your logo + sitelinks) -->
<script type='application/ld+json'>
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "YOUR BLOG NAME",
  "url": "https://YOURBLOG.blogspot.com",
  "description": "YOUR BLOG DESCRIPTION HERE",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://YOURBLOG.blogspot.com/search?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>

<script type='application/ld+json'>
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "YOUR BLOG NAME",
  "url": "https://YOURBLOG.blogspot.com",
  "logo": "https://YOURBLOG.blogspot.com/YOUR-LOGO-IMAGE.png",
  "sameAs": [
    "https://twitter.com/YOURHANDLE",
    "https://facebook.com/YOURPAGE"
  ]
}
</script>
