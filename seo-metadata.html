<!--
  =============================================
  SEO METADATA FOR BLOGGER
  =============================================
  HOW TO ADD THIS TO YOUR BLOG:
  1. Go to Blogger Dashboard > Theme > Edit HTML
  2. Find the <head> tag
  3. Paste everything below right after <head>
  4. Save
  =============================================
-->

<!-- Basic SEO -->
<meta name='description' content='Driving Efficacy and Effective Solutions.'/>
<meta name='keywords' content='consultancy, efficacy, effective solutions, Efic Consultancy'/>
<meta name='author' content='Efic Consultancy Ltd'/>

<!-- Open Graph (controls how your link looks on Facebook, WhatsApp, etc.) -->
<meta property='og:type' content='website'/>
<meta property='og:site_name' content='Efic Consultancy Ltd'/>
<meta property='og:title' content='Efic Consultancy Ltd'/>
<meta property='og:description' content='Driving Efficacy and Effective Solutions.'/>
<meta property='og:url' content='https://eficc.blogspot.com'/>
<meta property='og:image' content='https://eficc.blogspot.com/YOUR-LOGO-IMAGE.png'/>

<!-- Twitter/X Card -->
<meta name='twitter:card' content='summary'/>
<meta name='twitter:title' content='Efic Consultancy Ltd'/>
<meta name='twitter:description' content='Driving Efficacy and Effective Solutions.'/>
<meta name='twitter:image' content='https://eficc.blogspot.com/YOUR-LOGO-IMAGE.png'/>

<!-- Schema.org Structured Data (helps Google show your logo + sitelinks) -->
<script type='application/ld+json'>
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Efic Consultancy Ltd",
  "url": "https://eficc.blogspot.com",
  "description": "Driving Efficacy and Effective Solutions.",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "https://eficc.blogspot.com/search?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>

<script type='application/ld+json'>
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Efic Consultancy Ltd",
  "url": "https://eficc.blogspot.com",
  "logo": "https://eficc.blogspot.com/YOUR-LOGO-IMAGE.png",
  "sameAs": [
    "https://twitter.com/YOURHANDLE",
    "https://facebook.com/YOURPAGE"
  ]
}
</script>
