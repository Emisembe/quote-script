<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- EFIC Consultancy Ltd: Inkscape project. Open in Inkscape 1.2 or newer.
     Install the fonts in ../fonts first (see README.md). -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     xmlns:osb="http://www.openswatchbook.org/uri/2009/osb"
     width="512px" height="512px" viewBox="0 0 512 512" version="1.1" id="efic-icon">
  <title>EFIC Icon (E) - Full colour on navy</title>
  <sodipodi:namedview id="namedview" pagecolor="#ffffff" bordercolor="#666666" borderopacity="1"
     inkscape:pagecheckerboard="true" inkscape:deskcolor="#d1d1d1" inkscape:document-units="px">
    <inkscape:page x="0" y="0" width="512" height="512" id="page-icon-navy-bg" inkscape:label="Icon (E) - Full colour on navy"/>
  </sodipodi:namedview>
  <defs id="defs">
    <linearGradient id="efic-navy" inkscape:swatch="solid" osb:paint="solid" inkscape:label="EFIC Navy"><stop offset="0" style="stop-color:#14213D;stop-opacity:1"/></linearGradient>
    <linearGradient id="efic-gold" inkscape:swatch="solid" osb:paint="solid" inkscape:label="EFIC Gold"><stop offset="0" style="stop-color:#E7B165;stop-opacity:1"/></linearGradient>
    <linearGradient id="efic-white" inkscape:swatch="solid" osb:paint="solid" inkscape:label="EFIC White"><stop offset="0" style="stop-color:#FFFFFF;stop-opacity:1"/></linearGradient>
    <linearGradient id="efic-black" inkscape:swatch="solid" osb:paint="solid" inkscape:label="EFIC Black"><stop offset="0" style="stop-color:#000000;stop-opacity:1"/></linearGradient>
  </defs>
  <g inkscape:groupmode="layer" id="layer-icon-navy-bg" inkscape:label="Icon (E) - Full colour on navy">
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="512" height="512" style="fill:url(#efic-navy)" inkscape:label="Background" sodipodi:insensitive="true"/>
      <text xml:space="preserve" style="font-family:'Source Sans 3';font-weight:900;font-style:normal;font-size:364.61px;line-height:1;letter-spacing:0px;-inkscape-font-specification:'Source Sans 3 Heavy';text-anchor:middle;text-align:center;fill:url(#efic-white)" x="252.72" y="339.94" inkscape:label="E">E</text>
      <rect x="165.85" y="370.66" width="180.3" height="38.4" rx="19.2" style="fill:url(#efic-gold)" inkscape:label="Gold rule"/>
    </g>
  </g>
</svg>
