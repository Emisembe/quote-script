<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  THE RIVER MUSA SHOW: BUSINESS CARD (Inkscape 1.2 or newer, two pages: Front and Back)
  Card: 85 x 55 mm. Each page is 91 x 61 mm = card + 3 mm bleed on every side.
  Before you start: install the font BebasNeue-Regular.ttf (double-click it > Install), then open this file.
  Edit: double-click any text. Placeholders to replace: phone, email, website, YouTube handle, QR code.
  QR code: delete the dashed "QR" box, then Extensions > Render > Barcode > QR Code, type your website,
           set the size, and move it into the box's place (about 20 x 20 mm).
  Show cut line / safe area: Layers panel > "Print guides" > eye icon. Hide it again before exporting.
  Print: File > Save a Copy > PDF, "Convert text to paths", "Use document's page size", one PDF with both pages.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  width="192mm" height="61mm" viewBox="0 0 192 61" version="1.1" id="business-card">
  <title>The River Musa Show: business card</title>
  <sodipodi:namedview id="namedview" pagecolor="#ffffff" bordercolor="#999999" inkscape:document-units="mm" inkscape:pageshadow="2" showgrid="false" inkscape:zoom="4" inkscape:current-layer="layer-front">
    <inkscape:page x="0" y="0" width="91" height="61" id="page-front" inkscape:label="Front" bleed="0"/>
    <inkscape:page x="101" y="0" width="91" height="61" id="page-back" inkscape:label="Back" bleed="0"/>
  </sodipodi:namedview>
  <defs>
    <clipPath id="clip-front"><rect x="0" y="0" width="91" height="61"/></clipPath>
    <clipPath id="clip-back"><rect x="101" y="0" width="91" height="61"/></clipPath>
  </defs>

  <!-- ================= FRONT ================= -->
  <g inkscape:groupmode="layer" inkscape:label="Front" id="layer-front">
    <rect id="front-background" x="0" y="0" width="91" height="61" style="fill:#0D1C2E"/>
    <g id="front-ripples" clip-path="url(#clip-front)" style="fill:none;stroke:#00C0A8;stroke-width:0.35">
      <circle cx="91" cy="61" r="14" style="opacity:0.16"/>
      <circle cx="91" cy="61" r="22" style="opacity:0.11"/>
      <circle cx="91" cy="61" r="30" style="opacity:0.07"/>
      <circle cx="91" cy="61" r="38" style="opacity:0.04"/>
    </g>
    <g id="front-logo">
      <rect id="logo-bar" x="33.2" y="17.6" width="1.1" height="21" style="fill:#00C0A8"/>
      <text id="logo-river" x="36.2" y="27.4" style="font-family:'Bebas Neue';font-weight:normal;font-size:11px;letter-spacing:0.3px;fill:#FFFFFF">RIVER</text>
      <text id="logo-musa" x="36.2" y="37.7" style="font-family:'Bebas Neue';font-weight:normal;font-size:11px;letter-spacing:0.3px;fill:#00C0A8">MUSA</text>
      <text id="logo-show" x="36.5" y="41.7" style="font-family:Arial,'Liberation Sans',Helvetica,sans-serif;font-weight:bold;font-size:2.4px;letter-spacing:2.3px;fill:#C9D2E0">SHOW</text>
    </g>
    <text id="front-tagline" x="45.5" y="51.6" style="font-family:Arial,'Liberation Sans',Helvetica,sans-serif;font-weight:bold;font-size:2.25px;letter-spacing:0.55px;text-anchor:middle;fill:#00C0A8">CULTURE · CONVERSATION · CONNECTION</text>
  </g>

  <!-- ================= BACK ================= -->
  <g inkscape:groupmode="layer" inkscape:label="Back" id="layer-back">
    <rect id="back-background" x="101" y="0" width="91" height="61" style="fill:#FFFFFF"/>
    <rect id="back-name-bar" x="107" y="9.2" width="1" height="11.6" style="fill:#00C0A8"/>
    <text id="back-name" x="110" y="15.6" style="font-family:'Bebas Neue';font-weight:normal;font-size:7px;letter-spacing:0.25px;fill:#0D1C2E">MURDOCK EMISEMBE</text>
    <text id="back-role" x="110" y="20.1" style="font-family:Arial,'Liberation Sans',Helvetica,sans-serif;font-weight:bold;font-size:2.45px;letter-spacing:0.45px;fill:#00C0A8">HOST &amp; CREATOR</text>
    <rect id="back-divider" x="110" y="23" width="18" height="0.4" style="fill:#00C0A8"/>
    <g id="back-contacts">
      <g transform="translate(110.00 26.85) scale(0.1208)" style="fill:none;stroke:#00C0A8;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></g>
      <text id="contact-phone" x="114.4" y="29.2" style="font-family:Arial,'Liberation Sans',Helvetica,sans-serif;font-size:2.5px;fill:#0D1C2E">+49 000 000 0000</text>
      <g transform="translate(110.00 31.45) scale(0.1208)" style="fill:none;stroke:#00C0A8;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="22 6 12 13 2 6"/></g>
      <text id="contact-email" x="114.4" y="33.8" style="font-family:Arial,'Liberation Sans',Helvetica,sans-serif;font-size:2.5px;fill:#0D1C2E">hello@yourdomain.com</text>
      <g transform="translate(110.00 36.05) scale(0.1208)" style="fill:none;stroke:#00C0A8;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="10"/><line x1="2" x2="22" y1="12" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></g>
      <text id="contact-website" x="114.4" y="38.4" style="font-family:Arial,'Liberation Sans',Helvetica,sans-serif;font-size:2.5px;fill:#0D1C2E">rivermusatestshow.blogspot.com</text>
      <g transform="translate(110.00 40.65) scale(0.1208)" style="fill:none;stroke:#00C0A8;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><rect x="2" y="5" width="20" height="14" rx="4"/><polygon points="10 9 15 12 10 15 10 9"/></g>
      <text id="contact-youtube" x="114.4" y="43.0" style="font-family:Arial,'Liberation Sans',Helvetica,sans-serif;font-size:2.5px;fill:#0D1C2E">@yourchannel</text>
    </g>
    <g id="back-qr-placeholder">
      <!-- Replace this box with a real QR code: Extensions > Render > Barcode > QR Code -->
      <rect x="163.5" y="11.5" width="20" height="20" rx="1.2" style="fill:#F5F7FA;stroke:#0D1C2E;stroke-width:0.3;stroke-dasharray:1,0.8"/>
      <text x="173.5" y="22.6" style="font-family:'Bebas Neue';font-weight:normal;font-size:5px;letter-spacing:0.4px;text-anchor:middle;fill:#0D1C2E">QR</text>
      <text x="173.5" y="26.2" style="font-family:Arial,'Liberation Sans',Helvetica,sans-serif;font-size:1.6px;text-anchor:middle;fill:#6B7A8D">add your link</text>
    </g>
    <text id="back-qr-caption" x="173.5" y="35.6" style="font-family:'Bebas Neue';font-weight:normal;font-size:2.8px;letter-spacing:0.6px;text-anchor:middle;fill:#00C0A8">SCAN TO WATCH</text>
    <rect id="back-strip" x="101" y="48" width="91" height="13" style="fill:#0D1C2E"/>
    <text id="back-strip-show" x="110" y="54.2" style="font-family:'Bebas Neue';font-weight:normal;font-size:3.5px;letter-spacing:0.4px;fill:#FFFFFF">THE RIVER MUSA SHOW</text>
    <text id="back-strip-tagline" x="183" y="53.9" style="font-family:Arial,'Liberation Sans',Helvetica,sans-serif;font-size:2.1px;text-anchor:end;fill:#00C0A8">Culture. Conversation. Connection.</text>
  </g>

  <!-- ================= PRINT GUIDES (hidden; never print these) ================= -->
  <g inkscape:groupmode="layer" inkscape:label="Print guides (hide before export)" id="layer-guides" style="display:none" sodipodi:insensitive="true">
    <rect x="3" y="3" width="85" height="55" style="fill:none;stroke:#FF00FF;stroke-width:0.2;stroke-dasharray:1,0.6"/>
    <rect x="6" y="6" width="79" height="49" style="fill:none;stroke:#00AEEF;stroke-width:0.2;stroke-dasharray:0.6,0.6"/>
    <rect x="104" y="3" width="85" height="55" style="fill:none;stroke:#FF00FF;stroke-width:0.2;stroke-dasharray:1,0.6"/>
    <rect x="107" y="6" width="79" height="49" style="fill:none;stroke:#00AEEF;stroke-width:0.2;stroke-dasharray:0.6,0.6"/>
    <text x="4" y="2.2" style="font-family:Arial,'Liberation Sans',Helvetica,sans-serif;font-size:1.4px;fill:#FF00FF">cut line (85 x 55 mm)</text>
    <text x="105" y="2.2" style="font-family:Arial,'Liberation Sans',Helvetica,sans-serif;font-size:1.4px;fill:#FF00FF">cut line (85 x 55 mm) · blue = keep text inside</text>
  </g>
</svg>
