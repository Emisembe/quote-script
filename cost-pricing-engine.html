function reportCharts(R) {
  const cfg = chartConfigs(R, 'light', true);
  if (window.Chart) {

      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h; cv.style.width = w + 'px'; cv.style.height = h + 'px';
      const host = document.createElement('div');
      host.style.cssText = 'position:fixed;left:-9999px;top:0;width:' + w + 'px;height:' + h + 'px';
      host.appendChild(cv); document.body.appendChild(host);
      c.options.devicePixelRatio = 2;
      const ch = new Chart(cv.getContext('2d'), c);
      const url = cv.toDataURL('image/png');
      ch.destroy(); host.remove();
      return '<img alt="" src="' + url + '">';
    };
    try { return [make(cfg.pie, 460, 300), make(cfg.line, 640, 340)]; } catch (e) { /* fall through to SVG */ }
  }

}

    SLIDER_DEF.map(s => '<tr><td>' + esc(t(s.l)) + '</td><td class="n">' + signedPct(sl[s.k]) + '</td></tr>').join('') + '</tbody></table>';

  $('report').innerHTML =
    '<div class="rp-head">' + icon('logo') + '<div><h1>' + esc(t('rpTitle')) + '</h1><div style="font-size:10pt;color:#3d3c39">' + esc(t('appTitle')) + '</div></div></div>' +
    '<div class="rp-meta">' +
      '<div>' + esc(t('rpScenario')) + ': <b>' + esc(S.name || t('unsaved')) + '</b></div>' +
      '<div>' + esc(t('rpModule')) + ': <b>' + esc(t(mod.l)) + '</b></div>' +
      '<div>' + esc(t('rpGenerated')) + ': <b>' + esc(date) + '</b></div>' +
      '<div>' + esc(t('rpCurrency')) + ': <b>' + esc(CUR) + '</b></div>' +
      '<div>' + esc(t('rpLanguage')) + ': <b>' + esc(langName) + '</b></div>' +
      '<div>' + esc(t('rpPeriod')) + ': <b>' + esc(per) + '</b></div>' +
    '</div>' +
    '<section class="rp-avoid"><h2>' + icon('target') + esc(t('decTitle')) + '</h2>' + decisionHTML(R, decide(R), true) + '</section>' +
    '<h2>' + icon('star') + esc(t('rpSummary')) + '</h2><div class="rp-summary">' + summary + '</div>' +
    '<div class="rp-kpis">' + kp(t('kpiUnitCost'), money(R.unit)) + kp(t('kpiPrice'), money(R.P)) + kp(t('kpiProfit'), money(R.profit)) +
      kp(t('kpiBE'), isFinite(R.be) ? volFmt(mod, Math.ceil(R.be)) : '-') + kp(t('rpVolume'), volFmt(mod, R.V)) + '</div>' +
    '<section class="rp-avoid"><h2>' + icon('tag') + esc(t('rpModels')) + '</h2><table><thead><tr><th>' + esc(t('rpModel')) + '</th><th class="n">' + esc(t('per', { u })) + '</th><th class="n">' + esc(t('netToYou')) + '</th><th class="n">' + esc(t('kpiUnitCost')) +
      '</th><th class="n">' + esc(t('profitPeriod', { p: per })) + '</th><th class="n">' + esc(t('netMargin')) + '</th><th class="n">' + esc(t('breakEven')) + '</th></tr></thead><tbody>' + modelRows + '</tbody></table></section>' +
    '<section class="rp-avoid"><h2>' + icon('pie') + esc(t('rpCharts')) + '</h2><div class="rp-charts"><div>' + pieImg + '</div><div>' + lineImg + '</div></div></section>' +
    '<section class="rp-avoid"><h2>' + icon('table') + esc(t('matrixTitle')) + ' (' + esc(t('m_' + R.sel + '_s')) + ')</h2>' + matrixHTML(R).replace(/<svg[\s\S]*?<\/svg>/g, '') + '</section>' +
    '<h2>' + icon('bulb') + esc(t('insightsTitle')) + '</h2>' + ins +
    '<section class="rp-avoid"><h2>' + icon('gauge') + esc(t('metricsTitle')) + '</h2><table><tbody>' + exRows + '</tbody></table></section>' + xt +
    '<h2>' + icon('layers') + esc(t('breakdownTitle')) + '</h2><div>' + ledgerHTML(R).replace(/<span class="sw"[^>]*><\/span>/g, '') + '</div>' +
    bom +
    '<h2>' + icon('file') + esc(t('rpAssumptions')) + '</h2><div class="rp-cols">' + assumptions + '</div>' +
    '<section class="rp-avoid"><h2>' + icon('sliders') + esc(t('rpWhatIf')) + '</h2>' + whatIf + '</section>' +
    '<section class="rp-avoid rp-sign"><h2>' + icon('check') + esc(t('signoff')) + '</h2>' +
      '<div class="rp-boxes">' + ['approve', 'revise', 'reject'].map(k => '<span><i></i>' + esc(t(k)) + '</span>').join('') + '</div>' +
      '<div class="rp-lines">' + ['agreedPrice', 'signName', 'signature', 'signDate'].map(k => '<div><span></span>' + esc(t(k)) + '</div>').join('') + '</div></section>' +
    '<div class="rp-foot">' + esc(t('rpDisclaimer')) + ' ' + esc(t('fxNote')) + '</div>';
}
function setPaper() { $('pageStyle').textContent = '@page { size: ' + (S.paper === 'letter' ? 'letter' : 'A4') + '; margin: 14mm 12mm; }'; }

/* ============================================================================
   SECTION N: EVENT WIRING
   ============================================================================ */
let rafPending = false;
function scheduleRecalc() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => { rafPending = false; renderResults(); });
}
function renderAll() {
  LANG = S.lang; CUR = S.cur;
  applyStatic();
  $('langSel').value = S.lang; $('curSel').value = S.cur; $('paperSel').value = S.paper;
  $('scName').value = S.name || '';
  setPaper();
  renderTabs(); renderInputs(); renderSliders(); renderScenarioList();
  renderResults();
}
function wire() {
  $('langSel').addEventListener('change', e => { S.lang = e.target.value; renderAll(); });
  $('curSel').addEventListener('change', e => {
    const from = S.cur, to = e.target.value;
    MODULES.forEach(m => convertData(m, S.data[m.id], from, to));
    S.cur = to; renderAll();
    toast(t('toastFx', { a: from, b: to }), 'coins');
  });
  $('paperSel').addEventListener('change', e => { S.paper = e.target.value; setPaper(); persist(); });
  $('themeBtn').addEventListener('click', () => {
    S.theme = S.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = S.theme;
    applyStatic();
    renderResults();
  });
  $('printBtn').addEventListener('click', () => { buildReport(); setTimeout(() => window.print(), 60); });
  window.addEventListener('beforeprint', buildReport);

  // Module tabs (click + arrow-key navigation)
  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('[data-mod]'); if (!b) return;
    S.module = b.dataset.mod; renderTabs(); renderInputs(); renderResults();
    $('tabs').querySelector('[data-mod="' + S.module + '"]').focus();
  });
  $('tabs').addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const i = MODULES.findIndex(m => m.id === S.module);
    const n = (i + (e.key === 'ArrowRight' ? 1 : -1) + MODULES.length) % MODULES.length;
    S.module = MODULES[n].id; renderTabs(); renderInputs(); renderResults();
    $('tabs').querySelector('[data-mod="' + S.module + '"]').focus();
  });

  // Inputs: scalar fields
  const inputs = $('inputs');
  inputs.addEventListener('input', e => {
    const el = e.target, d = S.data[S.module];
    if (el.dataset.k && el.tagName === 'INPUT') {
      const v = parseFloat(el.value);
      d.inputs[el.dataset.k] = isFinite(v) ? v : 0;
      scheduleRecalc();
    } else if (el.dataset.c) {
      const tr = el.closest('tr'), i = +tr.dataset.row, c = el.dataset.c;
      d.rows[i][c] = (c === 'item' || c === 'unit') ? el.value : (isFinite(parseFloat(el.value)) ? parseFloat(el.value) : 0);
      tr.querySelector('[data-cost]').textContent = money(rowCost(d.rows[i]));
      $('bomTotal').textContent = money(bomTotal(d.rows));
      scheduleRecalc();
    }
  });
  inputs.addEventListener('change', e => {
    const el = e.target;
    if (el.tagName === 'SELECT' && el.dataset.k) {
      S.data[S.module].inputs[el.dataset.k] = el.value;
      if (el.dataset.k === 'dunit') renderInputs();
      renderResults();
    }
  });
  inputs.addEventListener('click', e => {
    const d = S.data[S.module];
    const del = e.target.closest('[data-del]');
    if (del) { d.rows.splice(+del.dataset.del, 1); renderInputs(); renderResults(); return; }
    if (e.target.closest('#bomAdd')) {
      d.rows.push({ item: t('newItem'), unit: 'pcs', qty: 1, cost: 0, use: 1, waste: 0 });
      renderInputs(); renderResults();
      const rows = inputs.querySelectorAll('table.bom tbody tr');
      const last = rows[rows.length - 1]; if (last) last.querySelector('input').select();
    }
  });
  // Help tooltips: fixed-position and clamped inside the viewport
  const placeTip = e => {
    const h = e.target.closest && e.target.closest('.help'); if (!h) return;
    const tip = h.querySelector('.tip'); if (!tip) return;
    tip.style.display = 'block';
    const r = h.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    const left = Math.min(Math.max(8, r.left - 10), window.innerWidth - tw - 8);
    let top = r.top - th - 8; if (top < 8) top = r.bottom + 8;
    tip.style.left = left + 'px'; tip.style.top = top + 'px'; tip.style.display = '';
  };
  inputs.addEventListener('mouseover', placeTip);
  inputs.addEventListener('focusin', placeTip);
  inputs.addEventListener('toggle', e => {
    const sec = e.target.closest && e.target.closest('details.sec'); if (!sec) return;
    (S.open[S.module] = S.open[S.module] || {})[sec.dataset.sec] = sec.open; persist();
  }, true);

  // Sensitivity sliders
  $('sliders').addEventListener('input', e => {
    const k = e.target.dataset.sl; if (!k) return;
    S.sliders[k] = parseFloat(e.target.value);
    $('so_' + k).textContent = signedPct(S.sliders[k]);
    scheduleRecalc();
  });
  $('sensReset').addEventListener('click', () => { S.sliders = Object.assign({}, SLIDERS0); renderSliders(); renderResults(); });

  // Pricing model selection
  $('decision').addEventListener('click', e => {
    const b = e.target.closest('[data-apply]'); if (!b) return;
    S.sel = b.dataset.apply; renderResults();
  });
  $('models').addEventListener('click', e => {
    const b = e.target.closest('[data-model]'); if (!b) return;
    S.sel = b.dataset.model; renderResults();
    const f = $('models').querySelector('[data-model="' + S.sel + '"]'); if (f) f.focus();
  });

  // Scenario manager
  $('scSave').addEventListener('click', saveScenario);
  $('scName').addEventListener('keydown', e => { if (e.key === 'Enter') saveScenario(); });
  $('scName').addEventListener('input', e => { S.name = e.target.value; persist(); });
  $('scLoad').addEventListener('click', loadScenario);
  $('scDel').addEventListener('click', deleteScenario);
  $('scExport').addEventListener('click', exportJSON);
  $('scImportBtn').addEventListener('click', () => $('scImport').click());
  $('scImport').addEventListener('change', e => { const f = e.target.files[0]; if (f) importJSON(f); e.target.value = ''; });
  $('resetBtn').addEventListener('click', () => {
    if (!confirm(t('confirmReset'))) return;
    S.data[S.module] = defaultData(MOD[S.module], S.cur);
    delete S.open[S.module];
    renderInputs(); renderResults();
    toast(t('toastReset'), 'reset');
  });
}

/* ============================================================================
   SECTION O: BOOT
   ============================================================================ */
loadState();
document.documentElement.dataset.theme = S.theme;
wire();
renderAll();
if (!store.ok) toast(t('toastStorage'), 'alert');
</script>
</body>
</html>
