<!DOCTYPE html>
<!--
  ============================================================================
  Universal Cost Accounting, Strategic Pricing, Manufacturing & Customer Value Engine
  ----------------------------------------------------------------------------
  Single-file, offline-capable web application.
    - All HTML, CSS and JavaScript live in this one file.
    - Only external dependency: Chart.js (CDN). If the CDN is unreachable the
      app falls back to a built-in SVG chart renderer, so it keeps working offline.
    - All icons are inline SVG vectors (no emoji, no icon fonts, no images).
    - Scenarios persist in the browser via localStorage (save / load / delete /
      export JSON / import JSON).
    - Languages: English, Deutsch, Francais, Espanol.
    - Currencies: USD, EUR, GBP, JPY, CAD, AUD, CHF (locale-aware formatting).
    - Native print / PDF engine via @media print and a generated executive report.
  ============================================================================
-->
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universal Cost &amp; Pricing Engine</title>
<meta name="description" content="Cost accounting, strategic pricing, manufacturing and customer value simulator for eight business models.">

<!-- Chart.js (the only external dependency). A built-in SVG fallback renders charts when offline. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" async onload="window.__chartReady && window.__chartReady()"></script>

<!-- Print page size is injected here at runtime (A4 or Letter). -->
<style id="pageStyle">@page { size: A4; margin: 14mm 12mm; }</style>

<style>
/* ==========================================================================
   1. DESIGN TOKENS (light + dark themes)
   ========================================================================== */
:root {
  color-scheme: light;
  --page: #f3f3f0;
  --surface: #fcfcfb;
  --surface-2: #f4f4f1;
  --surface-3: #ebebe6;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #898781;
  --line: #e1e0d9;
  --line-2: #c3c2b7;
  --accent: #1c5cab;
  --accent-2: #2a78d6;
  --accent-soft: #e4eefb;
  --on-accent: #ffffff;
  --good: #0ca30c;
  --good-ink: #006300;
  --warn: #fab219;
  --warn-ink: #8a5a00;
  --crit: #d03b3b;
  --crit-ink: #b02a2a;
  --info: #2a78d6;
  --shadow: 0 1px 2px rgba(11,11,11,.05), 0 4px 16px rgba(11,11,11,.05);
  --ring: rgba(11,11,11,.10);
  --radius: 12px;
  --radius-sm: 8px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  /* Categorical series (validated reference palette, fixed order) */
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222220; --surface-3: #2c2c2a;
    --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #898781;
    --line: #2c2c2a; --line-2: #383835;
    --accent: #3987e5; --accent-2: #5598e7; --accent-soft: #16263b; --on-accent: #ffffff;
    --good-ink: #0ca30c; --warn-ink: #fab219; --crit-ink: #e66767;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 18px rgba(0,0,0,.35);
    --ring: rgba(255,255,255,.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222220; --surface-3: #2c2c2a;
  --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #898781;
  --line: #2c2c2a; --line-2: #383835;
  --accent: #3987e5; --accent-2: #5598e7; --accent-soft: #16263b; --on-accent: #ffffff;
  --good-ink: #0ca30c; --warn-ink: #fab219; --crit-ink: #e66767;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 18px rgba(0,0,0,.35);
  --ring: rgba(255,255,255,.10);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
}

/* ==========================================================================
   2. BASE
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
svg.ic { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
svg.ic.sm { width: 15px; height: 15px; }
svg.ic.lg { width: 22px; height: 22px; }
.num, td.n, th.n { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.hidden { display: none !important; }

/* ==========================================================================
   3. HEADER / TOOLBAR
   ========================================================================== */
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
}
@media (max-width: 640px) { .topbar { position: static; } }
.topbar-inner {
  max-width: 1560px; margin: 0 auto; padding: 10px 16px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 320px; }
.brand-mark { width: 38px; height: 38px; border-radius: 10px; background: var(--accent);
  color: var(--on-accent); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8;
  stroke-linecap: round; stroke-linejoin: round; }
.brand h1 { font-size: 16px; margin: 0; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; }
.brand p { margin: 2px 0 0; font-size: 12px; color: var(--ink-2); }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ctl { display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; height: 36px;
  border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink-2); }
.ctl select { border: 0; background: transparent; height: 34px; color: var(--ink); outline: none; cursor: pointer; }
.ctl select option { background: var(--surface); color: var(--ink); }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px;
  border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn:focus-visible, .tab:focus-visible, input:focus-visible, select:focus-visible, .model:focus-visible, .help:focus-visible {
  outline: 2px solid var(--accent-2); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--crit-ink); }
.btn.icon-only { width: 36px; padding: 0; justify-content: center; }

/* ==========================================================================
   4. MODULE TABS
   ========================================================================== */
.tabs-wrap { max-width: 1560px; margin: 0 auto; padding: 12px 16px 0; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.tab { display: flex; align-items: center; gap: 8px; padding: 9px 13px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  cursor: pointer; white-space: nowrap; font-weight: 600; font-size: 13px; }
.tab:hover { color: var(--ink); background: var(--surface-2); }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* ==========================================================================
   5. SCENARIO BAR
   ========================================================================== */
.scenario-bar { max-width: 1560px; margin: 10px auto 0; padding: 0 16px; }
.scenario-inner { display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; box-shadow: var(--shadow); }
.scenario-inner .label { display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--ink-2); font-size: 12px;
  text-transform: uppercase; letter-spacing: .04em; margin-right: 4px; }
.scenario-inner input[type=text] { height: 36px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--surface-2); padding: 0 10px; min-width: 200px; flex: 1 1 200px; }
.scenario-inner select { height: 36px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--surface-2); padding: 0 8px; min-width: 200px; flex: 1 1 200px; }
.sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 2px; }

/* ==========================================================================
   6. MAIN LAYOUT
   ========================================================================== */
.layout { max-width: 1560px; margin: 0 auto; padding: 14px 16px 40px;
  display: grid; grid-template-columns: minmax(360px, 500px) 1fr; gap: 16px; align-items: start; }
.col-inputs { display: flex; flex-direction: column; gap: 10px; }
.col-results { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (max-width: 1080px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.card { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; gap: 9px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
.card-h h2, .card-h h3 { margin: 0; font-size: 14px; font-weight: 700; }
.card-h .sub { margin-left: auto; font-size: 12px; color: var(--ink-3); }
.card-b { padding: 14px 16px; }
.ico-badge { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent); flex: none; }

/* ---------- Input sections ---------- */
details.sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
details.sec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px;
  padding: 11px 14px; font-weight: 700; font-size: 13.5px; user-select: none; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary .chev { margin-left: auto; transition: transform .18s; color: var(--ink-3); }
details.sec[open] > summary .chev { transform: rotate(180deg); }
details.sec[open] > summary { border-bottom: 1px solid var(--line); }
.sec-body { padding: 12px 14px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.sec-body.one { grid-template-columns: 1fr; }
@media (max-width: 480px) { .sec-body { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; min-width: 0; }
.field label { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); font-weight: 600; }
.field label span.txt { overflow-wrap: anywhere; }
.inp { display: flex; align-items: stretch; height: 34px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--surface-2); overflow: hidden; }
.inp:focus-within { border-color: var(--accent-2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-2) 22%, transparent); }
.inp .adorn { display: grid; place-items: center; padding: 0 8px; color: var(--ink-3); font-size: 12px;
  background: var(--surface-3); white-space: nowrap; font-weight: 600; }
.inp input, .inp select { flex: 1; min-width: 0; border: 0; background: transparent; padding: 0 9px; outline: none; height: 100%; }
.inp input[type=number] { font-variant-numeric: tabular-nums; text-align: right; }
.inp select option { background: var(--surface); }

/* Help tooltip */
.help { position: relative; display: inline-grid; place-items: center; color: var(--ink-3); cursor: help; border-radius: 50%; }
.help:hover, .help:focus { color: var(--accent-2); }
.help .tip { position: fixed; left: 0; top: 0; display: none;
  width: max-content; max-width: min(260px, calc(100vw - 16px)); padding: 8px 10px; border-radius: 8px; background: var(--ink); color: var(--surface);
  font-size: 12px; font-weight: 500; line-height: 1.4; box-shadow: var(--shadow); pointer-events: none;
  z-index: 60; white-space: normal; text-transform: none; letter-spacing: 0; }
.help:hover .tip, .help:focus .tip { display: block; }

/* ---------- Line-item (BOM) table ---------- */
.bom-wrap { grid-column: 1 / -1; overflow-x: auto; }
table.bom { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 470px; table-layout: fixed; }
table.bom th { text-align: left; font-weight: 700; color: var(--ink-3); padding: 4px 3px 6px; font-size: 10px;
  text-transform: uppercase; letter-spacing: .02em; line-height: 1.2; vertical-align: bottom; }
table.bom th.n { text-align: right; }
table.bom td { padding: 2px 2px; }
table.bom input { width: 100%; height: 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); padding: 0 5px; min-width: 0; }
table.bom input[type=number] { text-align: right; font-variant-numeric: tabular-nums; }
table.bom td.cost { text-align: right; font-weight: 700; white-space: nowrap; padding-right: 4px; overflow: hidden; text-overflow: ellipsis; }
table.bom tfoot td { border-top: 1px solid var(--line); padding-top: 8px; font-weight: 700; }
.row-del { border: 0; background: transparent; color: var(--ink-3); cursor: pointer; padding: 4px; border-radius: 6px; display: grid; place-items: center; }
.row-del:hover { color: var(--crit-ink); background: var(--surface-3); }

/* ==========================================================================
   7. RESULTS
   ========================================================================== */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1300px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 640px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { padding: 13px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.kpi .k-top { display: flex; align-items: center; gap: 7px; color: var(--ink-2); font-size: 12px; font-weight: 600; }
.kpi .k-top svg { color: var(--accent); }
.kpi .k-val { font-size: 22px; font-weight: 750; letter-spacing: -.02em; overflow-wrap: anywhere; line-height: 1.15; }
.kpi .k-sub { font-size: 11.5px; color: var(--ink-3); }
.kpi .k-val.neg { color: var(--crit-ink); }
.kpi .k-val.pos { color: var(--good-ink); }

/* Sliders */
.sliders { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 18px; }
@media (max-width: 1300px) { .sliders { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .sliders { grid-template-columns: 1fr; } }
.slider { display: flex; flex-direction: column; gap: 6px; }
.slider .s-top { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.slider .s-top output { margin-left: auto; font-weight: 750; color: var(--ink); font-variant-numeric: tabular-nums;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 3px;
  background: var(--surface-3); outline: none; cursor: pointer; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
  background: var(--accent); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--accent); }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--accent);
  border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--accent); }
.slider .s-scale { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-3); }

/* Pricing model cards */
.models { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .models { grid-template-columns: 1fr; } }
.model { position: relative; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: var(--surface);
  cursor: pointer; display: flex; flex-direction: column; gap: 8px; text-align: left; transition: border-color .15s, box-shadow .15s; }
.model:hover { border-color: var(--line-2); }
.model.sel { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
.model .m-head { display: flex; align-items: center; gap: 9px; }
.model .m-swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.model .m-name { font-weight: 750; font-size: 13.5px; line-height: 1.25; }
.model .m-desc { font-size: 11.5px; color: var(--ink-3); min-height: 32px; }
.model .m-name { overflow-wrap: anywhere; }
.model .m-price { font-size: 26px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.model .m-price small { font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: 0; }
.model dl { margin: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, auto); gap: 4px 10px; font-size: 12px; }
.model dt { color: var(--ink-2); }
.model dd { margin: 0; text-align: right; overflow-wrap: anywhere; font-weight: 700; font-variant-numeric: tabular-nums; }
.model .m-flag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700;
  color: var(--accent); }
.model .m-note { font-size: 11px; color: var(--warn-ink); display: flex; align-items: center; gap: 5px; }

/* Charts */
.charts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 16px; }
@media (max-width: 1200px) { .charts { grid-template-columns: minmax(0, 1fr); } }
.chart-box { position: relative; height: 300px; }
.chart-box svg.fallback { width: 100%; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* Data tables */
.tbl-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.data th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3);
  font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data td { padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data th.n, table.data td.n { text-align: right; }
table.data tr.hl td { background: var(--accent-soft); font-weight: 700; }
table.data td.neg { color: var(--crit-ink); font-weight: 700; }
table.data td.pos { color: var(--good-ink); font-weight: 700; }
table.data tr:last-child td { border-bottom: 0; }
table.data .sw { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 7px; vertical-align: middle; }
.pill { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px;
  background: var(--surface-3); color: var(--ink-2); }

/* Insights */
.insights { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 900px) { .insights { grid-template-columns: 1fr; } }
.ins { display: flex; gap: 10px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2);
  border-left-width: 4px; }
.ins .ins-ic { flex: none; margin-top: 1px; }
.ins .ins-t { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; }
.ins p { margin: 0; font-size: 12.5px; color: var(--ink); }
.ins.alert { border-left-color: var(--crit); } .ins.alert .ins-ic, .ins.alert .ins-t { color: var(--crit-ink); }
.ins.warn { border-left-color: var(--warn); } .ins.warn .ins-ic, .ins.warn .ins-t { color: var(--warn-ink); }
.ins.ok { border-left-color: var(--good); } .ins.ok .ins-ic, .ins.ok .ins-t { color: var(--good-ink); }
.ins.info { border-left-color: var(--info); } .ins.info .ins-ic, .ins.info .ins-t { color: var(--accent); }

/* Metric tiles */
.metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.metric { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface-2); }
.metric .mt-l { font-size: 11.5px; color: var(--ink-2); font-weight: 600; }
.metric .mt-v { font-size: 17px; font-weight: 750; margin-top: 3px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

/* Toast */
.toast-host { position: fixed; right: 16px; bottom: 16px; z-index: 100; display: flex; flex-direction: column; gap: 8px; max-width: min(380px, calc(100vw - 32px)); }
.toast { display: flex; align-items: center; gap: 9px; background: var(--ink); color: var(--surface); padding: 10px 14px;
  border-radius: 10px; font-size: 13px; box-shadow: var(--shadow); animation: tin .2s ease-out; }
@keyframes tin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.footer-note { max-width: 1560px; margin: 0 auto; padding: 0 16px 30px; font-size: 11.5px; color: var(--ink-3);
  display: flex; align-items: center; gap: 6px; }

/* Decision panel (screen + print) */
.dec { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1.3fr); gap: 18px; border-left: 5px solid var(--line-2); padding-left: 14px; }
@media (max-width: 1150px) { .dec { grid-template-columns: minmax(0, 1fr); } }
.dec.dec-go { border-left-color: var(--good); } .dec.dec-cond { border-left-color: var(--warn); } .dec.dec-no { border-left-color: var(--crit); }
.dec-verdict { display: flex; gap: 12px; align-items: flex-start; }
.dec-ic { flex: none; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); }
.dec-go .dec-ic, .dec-go .dec-v { color: var(--good-ink); } .dec-cond .dec-ic, .dec-cond .dec-v { color: var(--warn-ink); } .dec-no .dec-ic, .dec-no .dec-v { color: var(--crit-ink); }
.dec-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin-bottom: 3px; }
.dec-v { font-size: 22px; font-weight: 800; letter-spacing: -.01em; line-height: 1.15; }
.dec p { margin: 6px 0 0; font-size: 12.5px; color: var(--ink-2); }
.dec-price { font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
.dec-price small { font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: 0; }
.dec-band { position: relative; height: 10px; border-radius: 5px; background: var(--surface-3); margin: 12px 4px 12px; }
.dec-zone { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--good) 28%, transparent); border-radius: 5px; }
.dec-mk { position: absolute; top: -4px; width: 4px; height: 18px; margin-left: -2px; border-radius: 2px; background: var(--ink-3); }
.dec-mk.t { background: var(--s2); } .dec-mk.c { background: var(--s3); } .dec-mk.f { background: var(--crit); }
.dec-mk.p { top: -6px; width: 14px; height: 22px; margin-left: -7px; border-radius: 4px; background: var(--ink); border: 3px solid var(--surface); }
.dec-dl { margin: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; font-size: 12px; }
.dec-dl dt { color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.dec-dl dd { margin: 0; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.dec-dl i { width: 4px; height: 12px; border-radius: 2px; display: inline-block; }
.dec-dl i.f { background: var(--crit); } .dec-dl i.t { background: var(--s2); } .dec-dl i.c { background: var(--s3); }
.dec-side ul { margin: 0 0 10px; padding-left: 18px; font-size: 12.5px; }
.dec-side li { margin: 0 0 4px; }
.dec-diff { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2);
  background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; }
.dec-diff .btn { margin-left: auto; height: 32px; }
#report .dec { grid-template-columns: 1fr 1fr; gap: 10px 16px; }
#report .dec-side { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
#report .dec-side ul { font-size: 9.5pt; }
#report .dec-v { font-size: 16pt; } #report .dec-price { font-size: 18pt; }
#report .dec p { font-size: 9.5pt; color: #3d3c39; }
#report .rp-sign .rp-boxes { display: flex; gap: 28px; margin: 6px 0 18px; font-size: 10pt; }
#report .rp-sign .rp-boxes i { display: inline-block; width: 13px; height: 13px; border: 1.5px solid #0b0b0b; margin-right: 7px; vertical-align: -2px; }
#report .rp-sign .rp-lines { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 28px; font-size: 8.5pt; color: #6b6a65; }
#report .rp-sign .rp-lines span { display: block; border-bottom: 1px solid #0b0b0b; height: 22px; margin-bottom: 3px; }
#report section { margin: 0; }

/* Report is only visible when printing */
#report { display: none; }

/* ==========================================================================
   8. PRINT ENGINE (@media print)
   Hides every interactive element and shows the generated executive report.
   ========================================================================== */
@media print {
  :root, :root[data-theme="dark"] {
    color-scheme: light;
    --page: #ffffff; --surface: #ffffff; --surface-2: #f6f6f3; --surface-3: #ececE7;
    --ink: #0b0b0b; --ink-2: #3d3c39; --ink-3: #6b6a65; --line: #d9d8d0; --line-2: #c3c2b7;
    --accent: #1c5cab; --accent-soft: #e4eefb;
    --good-ink: #006300; --warn-ink: #7a4f00; --crit-ink: #b02a2a;
  }
  html, body { background: #ffffff !important; color: #0b0b0b; font-size: 10.5pt; }
  .app, .topbar, .tabs-wrap, .scenario-bar, .toast-host, .footer-note, button, input, select { display: none !important; }
  #report { display: block !important; }
  .rp-page-break { break-before: page; page-break-before: always; }
  .rp-avoid { break-inside: avoid; page-break-inside: avoid; }
}

/* ---------- Report typography (used in print) ---------- */
#report { font-family: var(--font); color: #0b0b0b; }
#report .rp-head { display: flex; align-items: center; gap: 12px; border-bottom: 2px solid #1c5cab; padding-bottom: 10px; margin-bottom: 14px; }
#report .rp-head svg { width: 34px; height: 34px; stroke: #1c5cab; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#report h1 { font-size: 18pt; margin: 0; letter-spacing: -.01em; }
#report h2 { break-after: avoid; page-break-after: avoid; font-size: 12.5pt; margin: 18px 0 8px; color: #1c5cab; border-bottom: 1px solid #d9d8d0; padding-bottom: 4px; display: flex; align-items: center; gap: 7px; }
#report h2 svg { width: 16px; height: 16px; stroke: #1c5cab; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#report .rp-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 18px; font-size: 9.5pt; color: #3d3c39; margin-bottom: 8px; }
#report .rp-meta b { color: #0b0b0b; }
#report .rp-summary { font-size: 10.5pt; line-height: 1.55; background: #f4f7fb; border: 1px solid #d6e2f2; border-radius: 6px; padding: 10px 12px; }
#report .rp-kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 10px 0; }
#report .rp-kpi { border: 1px solid #d9d8d0; border-radius: 6px; padding: 7px 8px; }
#report .rp-kpi .l { font-size: 8pt; color: #6b6a65; text-transform: uppercase; letter-spacing: .04em; }
#report .rp-kpi .v { font-size: 13pt; font-weight: 800; margin-top: 2px; }
#report table { width: 100%; border-collapse: collapse; font-size: 9pt; margin-bottom: 6px; }
#report th { text-align: left; background: #f1f1ee; font-size: 8pt; text-transform: uppercase; letter-spacing: .03em; padding: 5px 7px; border-bottom: 1px solid #c3c2b7; }
#report td { padding: 4.5px 7px; border-bottom: 1px solid #e6e5df; vertical-align: top; }
#report td.n, #report th.n { text-align: right; font-variant-numeric: tabular-nums; }
#report tr.hl td { background: #eaf1fb; font-weight: 700; }
#report .rp-charts { display: grid; grid-template-columns: 1fr 1.4fr; gap: 14px; align-items: center; }
#report .rp-charts img, #report .rp-charts svg { width: 100%; height: auto; }
#report .rp-ins { border-left: 3px solid #c3c2b7; padding: 4px 8px; margin: 5px 0; font-size: 9.5pt; }
#report .rp-ins.alert { border-color: #d03b3b; } #report .rp-ins.warn { border-color: #fab219; }
#report .rp-ins.ok { border-color: #0ca30c; } #report .rp-ins.info { border-color: #2a78d6; }
#report .rp-ins b { text-transform: uppercase; font-size: 8pt; letter-spacing: .04em; margin-right: 6px; }
#report .rp-cols { columns: 2; column-gap: 18px; }
#report .rp-cols table { break-inside: avoid; }
#report .rp-foot { margin-top: 16px; font-size: 8pt; color: #6b6a65; border-top: 1px solid #d9d8d0; padding-top: 6px; }

<!-- ==========================================================================
     APPLICATION SHELL

<header class="topbar">

      <div class="brand-mark" data-icon="logo"></div>

    </div>
  </div>
</header>

<div class="app">

      <input type="text" id="scName" data-i18n-ph="scenarioName" maxlength="80">
      <button class="btn primary" id="scSave" type="button"><span data-icon="save"></span><span data-i18n="save"></span></button>
      <span class="sep"></span>
      <select id="scList" aria-label="Saved scenarios"></select>
      <button class="btn" id="scLoad" type="button"><span data-icon="folder"></span><span data-i18n="load"></span></button>
      <button class="btn danger" id="scDel" type="button"><span data-icon="trash"></span><span data-i18n="delete"></span></button>
      <span class="sep"></span>
      <button class="btn" id="scExport" type="button"><span data-icon="download"></span><span data-i18n="exportJson"></span></button>

  <main class="layout">

    <aside class="col-inputs" id="inputs" aria-label="Inputs"></aside>

      <div class="card">

        <div class="card-b"><div class="models" id="models"></div></div>

        </div>

        <div class="card-b tbl-wrap" id="matrix"></div>

      <div class="card">

        <div class="card-b"><div class="insights" id="insights"></div></div>
      </div>

      <div class="card">
        <div class="card-h"><span class="ico-badge" data-icon="gauge"></span><h2 data-i18n="metricsTitle"></h2></div>

    </section>
  </main>

/** Translate a UI key (or an inline [en,de,fr,es] array) and fill {placeholders}. */
function t(key, vars) {
  let s;
  if (Array.isArray(key)) s = key[LANGS.indexOf(LANG)] || key[0];
  else { const e = T[key]; s = e ? (e[LANGS.indexOf(LANG)] || e[0]) : key; }
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
  return s;
}

    ] }
  ],
  compute(I, B, H) {
    const fi = 1 + I.infl / 100;                       // module inflation buffer
    const m = x => H.M(x) * fi, w = x => H.W(x) * fi, o = x => H.O(x) * fi;
    const cats = [
      { l: 'bom', g: 'mat', v: m(B), base: 1 },
      { l: 'pkg', g: 'mat', v: m(I.pkg), base: 1 },
      { l: 'napkin', g: 'mat', v: m(I.napkin), base: 1 },
      { l: ['LPG / propane gas', 'Flüssiggas', 'GPL / propane', 'GLP / propano'], g: 'energy', fx: 1, v: o(I.lpgCost / Math.max(I.lpgHrs, 0.1) * I.burnHrs), base: 1 },
      { l: ['Generator / lighting electricity', 'Strom Generator / Licht', 'Électricité groupe / éclairage', 'Electricidad generador / luz'], g: 'energy', fx: 1, v: o(I.genW / 1000 * I.genHrs * I.kwh), base: 1 },
      { l: ['Transport fuel', 'Transportkraftstoff', 'Carburant transport', 'Combustible de transporte'], g: 'logi', fx: 1, v: H.M(I.tripKm * I.fuelL / 100 * I.fuelP) * fi, base: 1 },
      { l: 'permit', g: 'comp', fx: 1, v: o(I.permit), base: 1 },
      { l: 'inspect', g: 'comp', fx: 1, v: o(I.inspect), base: 1 },
      { l: 'vendLic', g: 'comp', fx: 1, v: o(I.vendLic), base: 1 },
      { l: 'kitchen', g: 'comp', fx: 1, v: o(I.kitchen), base: 1 },
      { l: 'music', g: 'comp', fx: 1, v: o(I.music), base: 1 },
      { l: 'insur', g: 'comp', fx: 1, v: o(I.insur), base: 1 },
      { l: ['Prep labor', 'Vorbereitung', 'Préparation', 'Preparación'], g: 'labor', fx: 1, v: w(I.prepH * I.prepW), base: 1 },
      { l: ['Service staff labor', 'Servicepersonal', 'Personnel de service', 'Personal de servicio'], g: 'labor', fx: 1, v: w(I.staffN * I.servH * I.staffW), base: 1 },
      { l: ['Pack-down & cleaning labor', 'Abbau & Reinigung', 'Démontage & nettoyage', 'Recogida y limpieza'], g: 'labor', fx: 1, v: w(I.packH * I.packW), base: 1 },
      { l: ['Owner opportunity wage', 'Opportunitätslohn Inhaber', 'Salaire d’opportunité', 'Salario de oportunidad'], g: 'labor', fx: 1, v: o(I.ownH * I.ownW), base: 0 },
      { l: 'stall', g: 'equip', fx: 1, v: o(I.stall), base: 1 },
      { l: 'eqRent', g: 'equip', fx: 1, v: o(I.eqRent), base: 1 },
      { l: ['Equipment wear reserve', 'Verschleißrücklage', 'Réserve d’usure', 'Reserva de desgaste'], g: 'equip', fx: 1, v: o(I.eqVal * I.depr / 100), base: 0 }
    ];
    const fixedSum = cats.filter(c => c.fx).reduce((a, c) => a + c.v, 0);
    cats.push({ l: ['Weather / attendance risk reserve', 'Wetter- / Besucherrisiko', 'Réserve météo / fréquentation', 'Reserva clima / asistencia'], g: 'risk', fx: 1, v: fixedSum * I.risk / 100, base: 0 });

    // Post-purchase value capture (per event, then per portion)
    const tierM = H.opt('tier').m;
    const varU = cats.filter(c => !c.fx).reduce((a, c) => a + c.v, 0);
    const tx = I.vol / Math.max(I.family, 1);
    const contribTx = Math.max(I.wtp * tierM - varU, 0) * Math.max(I.family, 1);
    const sec = {
      repeat: tx * I.cardShare / 100 * I.repeat / 100 * I.visits * contribTx,
      leads: tx * I.cardShare / 100 * I.leadRate / 100 * I.leadVal,
      upsell: tx * I.upAttach / 100 * I.upMargin,
      catering: I.catLeads * I.catConv / 100 * I.catProfit
    };
    const secTotal = sec.repeat + sec.leads + sec.upsell + sec.catering;
    return {
      volume: I.vol, cats, pct: I.cardShare / 100 * I.cardFee / 100, chan: 0,
      markup: I.markup, margin: I.margin, wtp: I.wtp, mult: tierM,
      sec: secTotal / Math.max(I.vol, 1), memo: { sec, secTotal }
    };
  },
  extras(I, R) {
    const fam = Math.max(I.family, 1), tx = R.V / fam;
    const util = (R.V / Math.max(I.thru, 1)) / Math.max(I.servH, 0.1);
    return [
      { l: ['Transactions', 'Transaktionen', 'Transactions', 'Transacciones'], v: tx, f: 'int' },
      { l: ['Average ticket', 'Durchschnittsbon', 'Ticket moyen', 'Ticket medio'], v: R.P * fam, f: 'money' },
      { l: ['Family bundle price', 'Familienpaket-Preis', 'Prix menu famille', 'Precio pack familiar'], v: R.P * fam * (1 - I.bundle / 100), f: 'money' },
      { l: ['Secondary value per event', 'Folgewert je Event', 'Valeur secondaire / événement', 'Valor secundario / evento'], v: R.memo.secTotal, f: 'money' },
      { l: ['Card customers tracked', 'Erfasste Kartenkunden', 'Clients carte suivis', 'Clientes con tarjeta'], v: tx * I.cardShare / 100, f: 'int' },
      { l: ['Peak line utilisation', 'Auslastung in der Spitze', 'Utilisation en pointe', 'Uso de la línea en punta'], v: util, f: 'pct' },
      { l: ['Economic value per portion', 'Gesamtwert je Portion', 'Valeur économique / portion', 'Valor económico / ración'], v: R.P + R.sec, f: 'money' }
    ];
  },
  xtables(I, R, H) {
    const s = R.memo.sec;
    return [{
      title: ['Post-purchase value capture per event', 'Wertschöpfung nach dem Kauf je Event', 'Valeur post-achat par événement', 'Valor posventa por evento'],
      head: [['Channel', 'Kanal', 'Canal', 'Canal'], ['Value', 'Wert', 'Valeur', 'Valor'], ['Per portion', 'Je Portion', 'Par portion', 'Por ración']],
      num: [false, true, true],
      rows: [
        [['Tokenised repeat visits', 'Wiederkehrende Kartenkunden', 'Visites récurrentes (token)', 'Visitas recurrentes (token)'], s.repeat],
        [['Email / SMS leads', 'E-Mail- / SMS-Kontakte', 'Contacts e-mail / SMS', 'Contactos email / SMS'], s.leads],
        [['High-margin upsells', 'Margenstarke Zusatzverkäufe', 'Ventes additionnelles', 'Ventas adicionales'], s.upsell],
        [['Private catering bookings', 'Private Catering-Aufträge', 'Prestations traiteur privées', 'Reservas de catering'], s.catering]
      ].map(r => [t(r[0]), H.money(r[1]), H.money(r[1] / Math.max(I.vol, 1))])
    }];
  },
  insights(I, R, H) {
    const out = [];
    const need = R.V / Math.max(I.thru, 1);
    if (need > I.servH) out.push({ lv: 'alert', s: t(['Peak throughput bottleneck: {v} portions need {h} h of service at {c}/h but only {s} h are scheduled. Pre-batch, add a second line or extend hours.', 'Durchsatzengpass: {v} Portionen brauchen {h} Std. bei {c}/Std., geplant sind nur {s} Std. Vorproduzieren oder zweite Linie einplanen.', 'Goulot d’étranglement : {v} portions exigent {h} h à {c}/h mais seules {s} h sont prévues. Préparez à l’avance ou ajoutez une ligne.', 'Cuello de botella: {v} raciones requieren {h} h a {c}/h pero solo hay {s} h previstas. Prepare por lotes o añada una línea.'], { v: H.int(R.V), h: H.num(need), c: H.int(I.thru), s: H.num(I.servH) }) });
    else out.push({ lv: 'ok', s: t(['Throughput is sufficient: the line runs at {p} of peak capacity across {s} service hours.', 'Durchsatz ausreichend: Die Linie läuft mit {p} der Spitzenkapazität über {s} Std.', 'Capacité suffisante : la ligne tourne à {p} de sa capacité sur {s} h.', 'Capacidad suficiente: la línea opera al {p} de su capacidad en {s} h.'], { p: H.pct(need / Math.max(I.servH, .1)), s: H.num(I.servH) }) });
    if (R.memo.secTotal > 0) out.push({ lv: 'info', s: t(['Post-purchase value capture adds {a} per event ({b} per portion) through repeat cards, leads, upsells and catering. This lowers the value-model floor.', 'Wert nach dem Kauf: {a} je Event ({b} je Portion) aus Stammkunden, Kontakten, Zusatzverkäufen und Catering. Senkt die Untergrenze des Wertmodells.', 'La valeur post-achat ajoute {a} par événement ({b} par portion). Elle abaisse le plancher du modèle valeur.', 'El valor posventa aporta {a} por evento ({b} por ración) y reduce el suelo del modelo de valor.'], { a: H.money(R.memo.secTotal), b: H.money(R.sec) }) });
    return out;
  }
});

  compute(I, B, H) {
    const sf = 1 / Math.max(1 - I.scrap / 100, 0.01);
    const whole = I.chanSel === 'whole';
    const matU = H.M(B) * sf, pkgU = H.M(I.pkg) * sf;
    const cats = [
      { l: 'bom', g: 'mat', v: matU, base: 1 },
      { l: 'pkg', g: 'mat', v: pkgU, base: 1 },
      { l: ['Batch setup (amortised)', 'Rüstkosten (umgelegt)', 'Réglage de lot (amorti)', 'Preparación de lote (amortizada)'], g: 'labor', v: H.W(I.setupH * I.setupR) / Math.max(I.batch, 1), base: 1 },
      { l: ['Direct assembly labor', 'Direkte Montage', 'Assemblage direct', 'Montaje directo'], g: 'labor', v: H.W(I.asmW * I.asmMin / 60) * sf, base: 1 },
      { l: ['Machine depreciation reserve', 'Maschinenabschreibung', 'Amortissement machine', 'Amortización de máquina'], g: 'equip', v: H.O(I.machP / Math.max(I.machLife, 1)), base: 0 },
      { l: 'rent', g: 'oh', fx: 1, v: H.O(I.rent), base: 1 },
      { l: ['Utility power', 'Strom', 'Électricité', 'Electricidad'], g: 'energy', fx: 1, v: H.O(I.kw * I.runH * I.kwh), base: 1 },
      { l: 'inFreight', g: 'logi', fx: 1, v: H.O(I.inFreight), base: 1 },
      { l: ['Inventory holding cost', 'Lagerhaltungskosten', 'Coût de stockage', 'Coste de inventario'], g: 'logi', v: (matU + pkgU) * I.hold / 100 * I.holdM / 12, base: 0 },
      { l: 'cert', g: 'comp', fx: 1, v: H.O(I.cert / 12), base: 1 },
      { l: 'liab', g: 'comp', fx: 1, v: H.O(I.liab / 12), base: 1 }
    ];
    if (!whole) cats.push({ l: 'fulfil', g: 'logi', v: H.O(I.fulfil), base: 1 });
    return {
      volume: I.vol, cats, pct: whole ? 0 : I.d2cFee / 100,
      chan: whole ? 1 - (1 - I.retail / 100) * (1 - I.dist / 100) : 0,
      markup: I.markup, margin: I.margin, wtp: I.wtp, mult: H.opt('brand').m, sec: 0
    };
  },
  extras(I, R) {
    const whole = I.chanSel === 'whole';
    const out = [];
    if (whole) {
      out.push({ l: ['Wholesale price (retailer buys)', 'Händlereinkaufspreis', 'Prix de gros (détaillant)', 'Precio mayorista (minorista)'], v: R.P * (1 - I.retail / 100), f: 'money' });
      out.push({ l: ['Distributor buys at', 'Distributor-Einkaufspreis', 'Prix d’achat distributeur', 'Precio al distribuidor'], v: R.P * (1 - I.retail / 100) * (1 - I.dist / 100), f: 'money' });
    }
    out.push({ l: ['Factory-gate net / unit', 'Netto ab Werk / Stück', 'Net départ usine / unité', 'Neto en fábrica / unidad'], v: R.net(R.P), f: 'money' });
    out.push({ l: ['Batches per month', 'Lose / Monat', 'Lots / mois', 'Lotes / mes'], v: R.V / Math.max(I.batch, 1), f: 'num' });
    out.push({ l: ['Production hours / month', 'Fertigungsstunden / Monat', 'Heures de production / mois', 'Horas de producción / mes'], v: R.V * I.asmMin / 60 + R.V / Math.max(I.batch, 1) * I.setupH, f: 'num' });
    out.push({ l: ['Machine life at this volume', 'Maschinenlaufzeit bei dieser Menge', 'Durée de vie machine', 'Vida de la máquina'], v: I.machLife / Math.max(R.V, 1), f: 'mo' });
    return out;
  },
  xtables(I, R, H) {
    const P = R.P, whole = I.chanSel === 'whole';
    const r1 = whole ? P * I.retail / 100 : 0;
    const r2 = whole ? (P - r1) * I.dist / 100 : 0;
    const fees = (P - r1 - r2) * R.pct;
    const net = P - r1 - r2 - fees;
    const rows = [
      [t(['Shelf / list price', 'Regal- / Listenpreis', 'Prix public', 'PVP / precio de lista']), P],
      whole && [t(['Retailer margin', 'Händlermarge', 'Marge détaillant', 'Margen minorista']), -r1],
      whole && [t(['Distributor margin', 'Distributormarge', 'Marge distributeur', 'Margen distribuidor']), -r2],
      fees > 0 && [t(['Payment & platform fees', 'Zahlungs- & Plattformgebühren', 'Frais de paiement & plateforme', 'Comisiones de pago y plataforma']), -fees],
      [t(['Net to maker', 'Netto an Hersteller', 'Net fabricant', 'Neto fabricante']), net],
      [t(['Full unit cost', 'Volle Stückkosten', 'Coût unitaire complet', 'Coste unitario total']), -R.unit],
      [t(['Profit per unit', 'Gewinn je Stück', 'Bénéfice par unité', 'Beneficio por unidad']), net - R.unit]
    ].filter(Boolean);
    const hl = rows.map((r, i) => i).filter(i => i === rows.length - 1 || i === rows.length - 3);
    return [{ title: ['Channel price waterfall (selected model)', 'Preis-Wasserfall (gewähltes Modell)', 'Cascade de prix (modèle retenu)', 'Cascada de precio (modelo elegido)'],
      head: [['Step', 'Schritt', 'Étape', 'Paso'], ['Per unit', 'Je Stück', 'Par unité', 'Por unidad'], ['Share of shelf price', 'Anteil am Regalpreis', 'Part du prix public', 'Peso sobre PVP']],
      num: [false, true, true], hl,
      rows: rows.map(r => [r[0], H.money(r[1]), H.pct(P ? r[1] / P : 0)]) }];
  },
  insights(I, R, H) {
    const out = [];
    const su = R.cats[2].pu;   // batch setup line (per unit)
    if (su / R.unit > 0.03) {
      const saved = su / 2;
      out.push({ lv: 'info', s: t(['Batch setup adds {a} per unit ({p} of cost). Doubling the batch size to {b} saves {s} per unit.', 'Rüstkosten betragen {a} je Stück ({p}). Eine Verdopplung der Losgröße auf {b} spart {s} je Stück.', 'Le réglage ajoute {a} par unité ({p}). Doubler le lot à {b} économise {s} par unité.', 'La preparación añade {a} por unidad ({p}). Duplicar el lote a {b} ahorra {s} por unidad.'], { a: H.money(su), p: H.pct(su / R.unit), b: H.int(I.batch * 2), s: H.money(saved) }) });
    }
    if (I.chanSel === 'whole') {
      const minShelf = R.unit / ((1 - R.chan) * (1 - R.pct));
      out.push({ lv: 'warn', s: t(['Wholesale floor: the shelf price must be at least {a} just to cover full cost after retailer and distributor margins.', 'Großhandels-Untergrenze: Der Regalpreis muss mindestens {a} betragen, um nach Händler- und Distributormarge die Vollkosten zu decken.', 'Plancher de gros : le prix public doit atteindre {a} pour couvrir le coût complet après marges.', 'Suelo mayorista: el PVP debe ser al menos {a} para cubrir el coste tras márgenes.'], { a: H.money(minShelf) }) });
    }
    return out;
  }
});

      { k: 'admin', t: 'money', v: 1200, u: '/mo', l: ['Dispatch & admin overhead', 'Disposition & Verwaltung', 'Exploitation & administration', 'Despacho y administración'], h: ['Monthly dispatch, software and office cost.', 'Monatliche Disposition, Software und Büro.', 'Coûts mensuels d’exploitation et logiciel.', 'Coste mensual de despacho y software.'] }
    ] },
    { id: 'price', ic: 'tag', l: ['Pricing levers', 'Preishebel', 'Leviers de prix', 'Palancas de precio'], f: [
      { k: 'urg', t: 'sel', v: 'std', l: ['Service level', 'Servicelevel', 'Niveau de service', 'Nivel de servicio'], h: ['Urgency premium applied to the value price.', 'Eilzuschlag auf den Wertpreis.', 'Prime d’urgence sur le prix valeur.', 'Prima de urgencia sobre el precio de valor.'], o: [
        { v: 'std', m: 1.0, l: ['Standard', 'Standard', 'Standard', 'Estándar'] },
        { v: 'exp', m: 1.25, l: ['Express', 'Express', 'Express', 'Exprés'] },
        { v: 'same', m: 1.5, l: ['Same-day', 'Same-Day', 'Le jour même', 'En el día'] } ] },
      { k: 'markup', s: 'markup', v: 25 }, { k: 'margin', s: 'margin', v: 15 }, { k: 'wtp', s: 'wtp', v: 260 }
    ] }
  ],
  compute(I, B, H) {
    const fuel = H.M(I.routeKm * I.eff / 100 * I.fuelP);
    const transit = H.W(I.drvW * I.transH), handling = H.W(I.drvW * I.loadH);
    const depr = H.O(I.vehP * (1 - I.resid / 100) / Math.max(I.life, 1) * I.routeKm);
    const wear = H.O(I.wear * I.routeKm);
    const cats = [
      { l: ['Fuel', 'Kraftstoff', 'Carburant', 'Combustible'], g: 'energy', v: fuel, base: 1, km: 1 },
      { l: 'tolls', g: 'logi', v: H.O(I.tolls), base: 1, km: 1 },
      { l: 'park', g: 'logi', v: H.O(I.park), base: 1 },
      { l: ['Vehicle depreciation', 'Fahrzeugabschreibung', 'Amortissement véhicule', 'Amortización vehículo'], g: 'equip', v: depr, base: 0, km: 1 },
      { l: 'wear', g: 'equip', v: wear, base: 0, km: 1 },
      { l: ['Driver transit labor', 'Fahrerlohn Fahrzeit', 'Chauffeur en transit', 'Conductor en tránsito'], g: 'labor', v: transit, base: 1, km: 1 },
      { l: ['Loading & unloading labor', 'Be- & Entladung', 'Chargement & déchargement', 'Carga y descarga'], g: 'labor', v: handling, base: 1 },
      { l: 'ins', g: 'comp', fx: 1, v: H.O(I.ins), base: 1 },
      { l: 'admin', g: 'oh', fx: 1, v: H.O(I.admin), base: 0 }
    ];
    return { volume: I.vol, cats, pct: 0, chan: 0, markup: I.markup, margin: I.margin, wtp: I.wtp, mult: H.opt('urg').m, sec: 0,
      memo: { kmVar: fuel + H.O(I.tolls) + depr + wear + transit } };
  },
  extras(I, R, H) {
    const d = I.dunit === 'mi' ? 'mi' : 'km', km = Math.max(I.routeKm, 0.1), st = Math.max(I.stops, 1);
    return [
      { l: [`Cost per ${d}`, `Kosten je ${d}`, `Coût par ${d}`, `Coste por ${d}`], v: R.unit / km, f: 'money' },
      { l: ['Cost per drop', 'Kosten je Stopp', 'Coût par arrêt', 'Coste por parada'], v: R.unit / st, f: 'money' },
      { l: [`Price per ${d}`, `Preis je ${d}`, `Prix par ${d}`, `Precio por ${d}`], v: R.P / km, f: 'money' },
      { l: ['Price per drop', 'Preis je Stopp', 'Prix par arrêt', 'Precio por parada'], v: R.P / st, f: 'money' },
      { l: [`Distance per month (${d})`, `Strecke / Monat (${d})`, `Distance / mois (${d})`, `Distancia / mes (${d})`], v: R.V * km, f: 'int' },
      { l: ['Fleet hours per month', 'Fahrzeugstunden / Monat', 'Heures flotte / mois', 'Horas de flota / mes'], v: R.V * (I.transH + I.loadH), f: 'num' }
    ];
  },
  xtables(I, R, H) {
    // Zone / weight pricing schedule derived from the selected model:
    // the distance-driven share of the trip price becomes a per-distance rate,
    // the rest becomes a per-drop handling base, then a weight factor is applied.
    const d = I.dunit === 'mi' ? 'mi' : 'km', km = Math.max(I.routeKm, 0.1), st = Math.max(I.stops, 1);
    const kmShare = Math.min(R.memo.kmVar / Math.max(R.unit, 0.0001), 1);
    const perKm = R.P * kmShare / km;            // price per distance unit for a full route
    const dropBase = R.P * (1 - kmShare) / st;   // handling price per drop
    const zones = [[0, 10], [10, 25], [25, 50], [50, 100], [100, 250]];
    const wts = [[0, 5, 1], [5, 20, 1.15], [20, 100, 1.45], [100, 500, 2.1]];
    const rows = zones.map((z, i) => {
      const mid = (z[0] + z[1]) / 2;
      const base = dropBase + perKm * mid * 2 / st;   // out-and-back share for one drop
      return [String.fromCharCode(65 + i) + ': ' + z[0] + '-' + z[1] + ' ' + d].concat(wts.map(w => H.money(base * w[2])));
    });
    return [{ title: ['Zone & weight pricing schedule (per shipment)', 'Zonen- & Gewichtstarif (je Sendung)', 'Barème zones & poids (par envoi)', 'Tarifa por zona y peso (por envío)'],
      head: [['Zone', 'Zone', 'Zone', 'Zona']].concat(wts.map(w => [w[0] + '-' + w[1] + ' kg', w[0] + '-' + w[1] + ' kg', w[0] + '-' + w[1] + ' kg', w[0] + '-' + w[1] + ' kg'])),
      num: [false, true, true, true, true], rows }];
  },
  insights(I, R, H) {
    const st = Math.max(I.stops, 1);
    const now = R.unit / st;
    const handlingPerDrop = R.cats[6].pu / st;
    const next = (R.unit + handlingPerDrop) / (st + 1);
    return [{ lv: 'info', s: t(['Route density lever: adding one more drop per route lowers cost per drop from {a} to {b}.', 'Tourendichte: Ein zusätzlicher Stopp je Tour senkt die Kosten je Stopp von {a} auf {b}.', 'Densité de tournée : un arrêt de plus fait passer le coût par arrêt de {a} à {b}.', 'Densidad de ruta: una parada más reduce el coste por parada de {a} a {b}.'], { a: H.money(now), b: H.money(next) }) }];
  }
});

/* ---------------------------------------------------------------------------
   Shared builder for hour-based professional practices (legal + consulting).
   Billable hours become the "volume"; the naive cost-plus base spreads costs
   over ALL hours worked, which is exactly the classic under-pricing mistake.
   --------------------------------------------------------------------------- */
function practiceExtras(I, R, H, contKey) {
  const cont = (I[contKey] || 0) / 100;
  return [
    { l: ['Billable hours / year', 'Abrechenbare Std. / Jahr', 'Heures facturables / an', 'Horas facturables / año'], v: R.V, f: 'int' },
    { l: ['Utilisation rate', 'Auslastungsquote', 'Taux d’utilisation', 'Tasa de utilización'], v: R.memo.util, f: 'pct' },
    { l: ['Effective hourly rate', 'Effektiver Stundensatz', 'Taux horaire effectif', 'Tarifa horaria efectiva'], v: R.P, f: 'money' },
    { l: ['Fixed-fee project quote', 'Festpreisangebot Projekt', 'Devis forfaitaire projet', 'Presupuesto cerrado'], v: R.P * I.projH * (1 + cont), f: 'money' },
    { l: ['Monthly retainer', 'Monatspauschale', 'Forfait mensuel', 'Iguala mensual'], v: R.P * I.retH * (1 - I.retDisc / 100), f: 'money' },
    { l: ['Capacity hours / year', 'Kapazitätsstunden / Jahr', 'Heures de capacité / an', 'Horas de capacidad / año'], v: R.memo.capacity, f: 'int' }
  ];
}
function practiceTables(I, R, H, contKey) {
  const cont = (I[contKey] || 0) / 100;
  const rows = ['cp', 'rec', 'val'].map(k => {
    const p = R.prices[k];
    return [t('m_' + k + '_s'), H.money(p), H.money(p * I.projH * (1 + cont)), H.money(p * I.retH * (1 - I.retDisc / 100)), H.money(p * I.retH * (1 - I.retDisc / 100) * 12)];
  });
  return [{ title: ['Professional fee quotes by model', 'Honorarangebote nach Modell', 'Devis d’honoraires par modèle', 'Honorarios por modelo'],
    head: [['Model', 'Modell', 'Modèle', 'Modelo'], ['Hourly', 'Stündlich', 'Horaire', 'Por hora'], ['Fixed-fee project', 'Festpreisprojekt', 'Projet au forfait', 'Proyecto cerrado'], ['Monthly retainer', 'Monatspauschale', 'Forfait mensuel', 'Iguala mensual'], ['Retainer / year', 'Pauschale / Jahr', 'Forfait / an', 'Iguala / año']],
    num: [false, true, true, true, true], hlRow: ['cp', 'rec', 'val'].indexOf(R.sel), rows }];
}
function practiceInsight(I, R, H) {
  const out = [];
  const util = R.memo.util;
  const extra = I.weeks * (R.memo.realize || 1);           // +1 billable hour per week
  const a = R.unit, b = R.fixed / (R.V + extra) + R.varUnit;
  out.push({ lv: util < 0.6 ? 'warn' : 'info', s: t(['Only {p} of your working hours are billable. Converting one unbillable hour per week into billable time lowers your cost per hour from {a} to {b}.', 'Nur {p} Ihrer Arbeitszeit ist abrechenbar. Eine zusätzliche abrechenbare Stunde pro Woche senkt die Kosten je Stunde von {a} auf {b}.', 'Seules {p} de vos heures sont facturables. Une heure facturable de plus par semaine abaisse le coût horaire de {a} à {b}.', 'Solo el {p} de sus horas es facturable. Una hora facturable más por semana reduce el coste por hora de {a} a {b}.'], { p: H.pct(util), a: H.money(a), b: H.money(b) }) });
  return out;
}

/* Indicative offline reference rates (units of currency per 1 USD). */
const FX = { USD: 1, EUR: 0.86, GBP: 0.75, JPY: 150, CAD: 1.38, AUD: 1.53, CHF: 0.80 };

let CTX = { inf: 1, wage: 1, mat: 1, vol: 1 };       // active what-if multipliers

/** Locale chosen from language + currency so separators and symbol placement feel native. */

  const base = { en: 'en-US', de: 'de-DE', fr: 'fr-FR', es: 'es-ES' }[LANG];
  const special = { 'en-GBP': 'en-GB', 'en-CAD': 'en-CA', 'en-AUD': 'en-AU', 'de-CHF': 'de-CH', 'fr-CHF': 'fr-CH', 'fr-CAD': 'fr-CA', 'en-EUR': 'en-IE' };

}
const fmtCache = {};
function nf(opts) {

}
/** Currency string, e.g. 1.250,50 EUR in de-DE vs $1,250.50 in en-US. */
function money(x) {

  const a = Math.abs(x);

  return nf({ style: 'currency', currency: CUR, currencyDisplay: curDisplay(), minimumFractionDigits: d, maximumFractionDigits: d }).format(x);
}
/* EUR, GBP and JPY always show their own sign; dollar currencies keep the

function curDisplay() { return (CUR === 'EUR' || CUR === 'GBP' || CUR === 'JPY') ? 'narrowSymbol' : 'symbol'; }
function moneyCompact(x) {
  if (!isFinite(x)) return '-';
  return nf({ style: 'currency', currency: CUR, currencyDisplay: curDisplay(), notation: 'compact', maximumFractionDigits: 1 }).format(x);
}
function num(x, d) { if (!isFinite(x)) return '-'; return nf({ maximumFractionDigits: d === undefined ? 1 : d }).format(x); }
function int(x) { if (!isFinite(x)) return '-'; return nf({ maximumFractionDigits: 0 }).format(Math.round(x)); }
function pct(x) { if (!isFinite(x)) return '-'; return nf({ style: 'percent', maximumFractionDigits: 1 }).format(x); }

/** Currency symbol in the active locale (for input adornments). */

    const c = p.find(x => x.type === 'currency');

}

function roundMoney(v, cur) {
  const a = Math.abs(v);
  if (cur === 'JPY') return a >= 100 ? Math.round(v) : Math.round(v * 100) / 100;
  if (a >= 1000) return Math.round(v);

const HELPERS = { money, num, int, pct, x: ratioX };

/* Unit adornment labels (translated). Dynamic distance units depend on the logistics selector. */

  '/h': ['/h', '/Std.', '/h', '/h'], '/mo': ['/mo', '/Mon.', '/mois', '/mes'], '/yr': ['/yr', '/Jahr', '/an', '/año'],
  mo: ['mo', 'Mon.', 'mois', 'meses'], 'h/mo': ['h/mo', 'Std./Mon.', 'h/mois', 'h/mes'], wk: ['wk', 'Wo.', 'sem.', 'sem.'],
  min: ['min', 'Min.', 'min', 'min'], '/kWh': ['/kWh', '/kWh', '/kWh', '/kWh'], W: ['W', 'W', 'W', 'W'], kW: ['kW', 'kW', 'kW', 'kW'],
  km: ['km', 'km', 'km', 'km'], 'L/100': ['L/100 km', 'L/100 km', 'L/100 km', 'L/100 km'], '/L': ['/L', '/L', '/L', '/L'],
  x: ['×', '×', '×', '×'], '/yr ': ['/yr', '/Jahr', '/an', '/año']

/* ============================================================================
   SECTION F: MODULE PREPARATION (fields, defaults, labels)
   ============================================================================ */
const MOD = {};
MODULES.forEach(m => {
  MOD[m.id] = m;
  m._fields = []; m._fmap = {};
  m.sections.forEach(sec => {
    if (!sec.f) return;
    sec.f = sec.f.map(f => {
      const full = f.s ? Object.assign({}, SHARED[f.s], f) : f;
      delete full.s;
      m._fields.push(full); m._fmap[full.k] = full;
      return full;
    });
  });
});
/** Resolves a cost line label: inline array, field key, section id or UI key. */
function lbl(mod, l) {
  if (Array.isArray(l)) return t(l);
  if (mod._fmap[l]) return t(mod._fmap[l].l);
  const sec = mod.sections.find(s => s.id === l);
  if (sec) return t(sec.l);
  return t(l);
}
function optOf(mod, k, val) {
  const f = mod._fmap[k];
  if (!f || !f.o) return { m: 1 };
  return f.o.find(o => o.v === val) || f.o[0];
}
/** Default inputs for a module, converted from USD into the active currency. */
function defaultData(mod, cur) {
  const k = FX[cur] / FX.USD;
  const inputs = {};
  mod._fields.forEach(f => { inputs[f.k] = f.t === 'money' ? roundMoney(f.v * k, cur) : f.v; });
  const rows = mod.table ? mod.table.rows.map(r => Object.assign({}, r, { cost: roundMoney(r.cost * k, cur) })) : [];
  return { inputs, rows };
}
/** Converts a module data object between currencies in place. */
function convertData(mod, data, from, to) {
  if (from === to || !data) return data;
  const k = FX[to] / FX[from];
  mod._fields.forEach(f => { if (f.t === 'money' && isFinite(data.inputs[f.k])) data.inputs[f.k] = roundMoney(data.inputs[f.k] * k, to); });
  (data.rows || []).forEach(r => { r.cost = roundMoney((+r.cost || 0) * k, to); });
  return data;
}
/** Per-unit cost of one line-item row. */
function rowCost(r) {
  const qty = +r.qty || 0, cost = +r.cost || 0, use = +r.use || 0, waste = Math.min(+r.waste || 0, 95);
  if (qty <= 0) return 0;
  return cost / qty * use / (1 - waste / 100);
}
function bomTotal(rows) { return (rows || []).reduce((a, r) => a + rowCost(r), 0); }

/* ============================================================================
   SECTION G: CORE COST & PRICING ENGINE
   Unit cost(V)      = variable per unit + fixed / V
   Net per unit      = P x (1 - channel %) x (1 - fee %)
   Profit(V)         = V x (net - variable) - fixed
   Break-even volume = fixed / (net - variable)
   Model 1 Cost-plus = cost-plus base x (1 + markup)
   Model 2 Recovery  = full unit cost / ((1 - margin) x (1 - channel) x (1 - fees))
   Model 3 Value     = max(WTP x demographic/risk multiplier, floor)
                       floor = max(unit cost - secondary LTV per unit, variable) / net factor
   ============================================================================ */
function evaluate(mod, data, sl, sel) {
  const ctx = { vol: 1 + sl.vol / 100, inf: 1 + sl.inf / 100, wage: 1 + sl.wage / 100, mat: 1 + sl.mat / 100 };
  CTX = ctx;
  const I = data.inputs;
  const H = Object.assign({
    M: x => x * ctx.mat * ctx.inf,
    W: x => x * ctx.wage * ctx.inf,
    O: x => x * ctx.inf,
    opt: k => optOf(mod, k, I[k])
  }, HELPERS);
  const r = mod.compute(I, bomTotal(data.rows), H);
  let V = Math.max(r.volume * ctx.vol, 0.01);
  if (mod.unit !== 'hour') V = Math.max(Math.round(V), 1);

  let fixed = 0, varUnit = 0, baseFixed = 0, baseVar = 0;
  r.cats.forEach(c => {
    c.v = isFinite(c.v) ? c.v : 0;
    c.pu = c.fx ? c.v / V : c.v;
    c.tot = c.fx ? c.v : c.v * V;
    c.name = lbl(mod, c.l);
    if (c.fx) { fixed += c.v; if (c.base) baseFixed += c.v; }
    else { varUnit += c.v; if (c.base) baseVar += c.v; }
  });
  const unit = varUnit + fixed / V;
  const pctFee = Math.min(Math.max(r.pct || 0, 0), 0.95), chan = Math.min(Math.max(r.chan || 0, 0), 0.95);
  const k = (1 - chan) * (1 - pctFee);
  const net = P => P * k;
  const cpBase = r.cpBase ? baseVar + r.cpBase(V, baseFixed) : baseVar + baseFixed / V;
  const margin = Math.min(Math.max(r.margin, 0), 95) / 100;
  const sec = r.sec || 0;
  const floor = Math.max(unit - sec, varUnit) / k;
  const rawVal = (r.wtp || 0) * (r.mult || 1);
  const prices = {
    cp: cpBase * (1 + (r.markup || 0) / 100),
    rec: unit / ((1 - margin) * k),
    val: Math.max(rawVal, floor)
  };
  const profitAt = (P, vol) => vol * (net(P) - varUnit) - fixed;
  const beAt = P => { const cm = net(P) - varUnit; return cm > 0 ? fixed / cm : Infinity; };
  const P = prices[sel] || prices.rec;
  return {
    mod, I, V, baseV: r.volume, cats: r.cats, fixed, varUnit, unit, cpBase, prices, floor, rawVal,
    floored: rawVal < floor, pct: pctFee, chan, k, sec, net, profitAt, beAt, P, sel,
    be: beAt(P), profit: profitAt(P, V), memo: r.memo || {}, ctx, margin
  };
}

let LAST = null;   // last evaluation result (used by print)
function insightsFor(R) {
  const mod = R.mod, H = HELPERS, out = [];
  const u = unitS(mod), us = unitsS(mod), per = periodS(mod);
  const sl = S.sliders;
  if (sl.vol || sl.inf || sl.wage || sl.mat) out.push({ lv: 'info', s: t('in_whatif', { v: signedPct(sl.vol), i: signedPct(sl.inf), w: signedPct(sl.wage), m: signedPct(sl.mat) }) });
  // Compliance overhead share and the volume lever that dilutes it
  const compPU = R.cats.filter(c => c.g === 'comp').reduce((a, c) => a + c.pu, 0);
  const compFixed = R.cats.filter(c => c.g === 'comp' && c.fx).reduce((a, c) => a + c.v, 0);
  const share = compPU / R.unit;
  if (share > 0.05 && compFixed > 0) {
    const n = mod.unit === 'hour' ? Math.round(R.V * 0.3) : Math.max(Math.round(R.V * 0.3), 1);
    const drop = compFixed / R.V - compFixed / (R.V + n);
    out.push({ lv: share >= 0.12 ? 'alert' : 'warn', s: t('in_comp', { pct: pct(share), n: volFmt(mod, n), us, u, amt: money(drop) }) });
  }
  // Cost-plus blind spot
  const netCp = R.net(R.prices.cp);
  if (netCp < R.unit) out.push({ lv: 'alert', s: t('in_cpLoss', { p: money(R.prices.cp), net: money(netCp), u, c: money(R.unit), loss: money(R.unit - netCp), tot: money((R.unit - netCp) * R.V), per }) });
  else { const m = (netCp - R.unit) / netCp; if (m < R.margin / 2) out.push({ lv: 'warn', s: t('in_cpThin', { m: pct(m) }) }); }
  if (R.chan > 0) out.push({ lv: 'warn', s: t('in_channel', { pct: pct(R.chan), net: money(netCp), u, c: money(R.unit) }) });
  if (R.pct > 0.04) out.push({ lv: 'info', s: t('in_fees', { pct: pct(R.pct), amt: money(R.P * R.pct * (1 - R.chan)), u }) });
  // Break-even for the selected model
  const mName = t('m_' + R.sel + '_s');
  if (!isFinite(R.be)) out.push({ lv: 'alert', s: t('in_beNever', { m: mName, u }) });
  else if (R.be > R.V) out.push({ lv: 'alert', s: t('in_beAlert', { m: mName, be: volFmt(mod, Math.ceil(R.be)), us, gap: volFmt(mod, Math.ceil(R.be - R.V)), v: volFmt(mod, R.V) }) });
  else out.push({ lv: 'ok', s: t('in_beOk', { m: mName, pct: pct(1 - R.be / R.V), be: volFmt(mod, Math.ceil(R.be)), us }) });
  // Operating leverage
  const fixedShare = (R.fixed / R.V) / R.unit;
  if (fixedShare > 0.55) out.push({ lv: 'warn', s: t('in_fixed', { pct: pct(fixedShare), a: money(R.unit), b: money(R.varUnit + R.fixed / (R.V * 0.7)) }) });
  // Value-based opportunity or gap
  if (R.floored) out.push({ lv: 'warn', s: t('in_floor', { f: money(R.floor) }) });
  if (R.rawVal < R.prices.rec) out.push({ lv: 'warn', s: t('in_valueLow', { wtp: money(R.rawVal), pct: pct(1 - R.rawVal / R.prices.rec), rec: money(R.prices.rec) }) });
  else if (R.prices.val > R.prices.rec * 1.05) out.push({ lv: 'info', s: t('in_value', { d: money(R.prices.val - R.prices.rec), u, pct: pct(R.prices.val / R.prices.rec - 1), tot: money((R.net(R.prices.val) - R.net(R.prices.rec)) * R.V), per }) });
  // Module-specific advisories
  (mod.insights ? mod.insights(R.I, R, H) : []).forEach(x => out.push(x));
  const order = { alert: 0, warn: 1, info: 2, ok: 3 };
  return out.sort((a, b) => order[a.lv] - order[b.lv]);
}

/* ============================================================================
   DECISION ENGINE
   Market ceiling = willingness to pay x demographic / risk multiplier.
   Recommended model = the most profitable model whose price the market will
   accept (price <= ceiling) and that makes a profit at the planned volume.
   Verdict: Go (target margin met, >= 20% safety buffer), Go with conditions
   (profitable but thin), Rethink (no profitable price within the ceiling).
   ============================================================================ */
function decide(R) {
  const mod = R.mod, u = unitS(mod), us = unitsS(mod), per = periodS(mod);
  const ceil = R.rawVal > 0 ? R.rawVal : Infinity;
  const floor = R.unit / R.k;                      // zero-profit price at planned volume
  const all = MODEL_KEYS.map(k => ({ k, P: R.prices[k], prof: R.profitAt(R.prices[k], R.V) }));
  const cands = all.filter(c => c.P <= ceil * 1.0005 && c.prof > 0).sort((a, b) => b.prof - a.prof);
  const pick = cands[0] || all.find(c => c.k === 'rec');
  const nv = R.net(pick.P) * R.V, margin = nv > 0 ? pick.prof / nv : NaN;
  const be = R.beAt(pick.P), safety = isFinite(be) ? 1 - be / R.V : -1;
  let verdict = 'no', desc;
  const why = [], ceilTxt = isFinite(ceil) ? money(ceil) : t('notSet');
  if (cands.length) {
    const reasons = [];
    if (margin < R.margin - 0.005) reasons.push(t('why_margin', { m: pct(margin), t: pct(R.margin) }));
    if (safety < 0.2) reasons.push(t('why_safety', { s: pct(Math.max(safety, 0)) }));
    verdict = reasons.length ? 'cond' : 'go';
    desc = verdict === 'go' ? t('v_go_d', { t: pct(R.margin), s: pct(safety) }) : t('v_cond_d', { why: reasons.join(t('why_and')) });
    if (pick.k !== 'val') why.push(t('r_' + pick.k, { p: money(pick.P), c: ceilTxt }));
    else if (pick.P >= R.prices.rec) why.push(t('r_val', { c: ceilTxt, u, r: money(R.prices.rec) }));
    else why.push(t('r_valBelow', { p: money(pick.P), d: money(R.prices.rec - pick.P), r: money(R.prices.rec) }));
  } else {
    desc = t('v_no_d', { c: ceilTxt, u });
    why.push(t('r_none', { r: money(R.prices.rec), u, c: ceilTxt }));
  }
  why.push(t('r_profit', { pr: money(pick.prof), per, be: isFinite(be) ? volFmt(mod, Math.ceil(be)) : t('notReached'), us, v: volFmt(mod, R.V) }));
  // Actions: the most severe advisories for the recommended price
  const Rp = Object.assign({}, R, { P: pick.P, sel: pick.k, be, profit: pick.prof });
  const actions = insightsFor(Rp).filter(x => (x.lv === 'alert' || x.lv === 'warn')).slice(0, 4).map(x => x.s);
  return { verdict, desc, k: pick.k, P: pick.P, prof: pick.prof, margin, be, safety, floor, target: R.prices.rec, ceil, why, actions };
}
const VERDICT_ICON = { go: 'check', cond: 'alert', no: 'octagon' };
function decisionHTML(R, D, forPrint) {
  const mod = R.mod, u = unitS(mod);
  const pts = [D.floor, D.target, D.P].concat(isFinite(D.ceil) ? [D.ceil] : []).filter(isFinite);
  const lo = Math.min(...pts) * 0.85, hi = Math.max(...pts) * 1.08, pos = v => Math.min(Math.max((v - lo) / (hi - lo) * 100, 0), 100).toFixed(1);
  const mk = (v, cls, l) => isFinite(v) ? '<span class="dec-mk ' + cls + '" style="left:' + pos(v) + '%" title="' + esc(l) + ': ' + esc(money(v)) + '"></span>' : '';
  const band = '<div class="dec-band" aria-hidden="true"><span class="dec-zone" style="left:' + pos(D.floor) + '%;right:' + (100 - pos(isFinite(D.ceil) ? Math.max(D.ceil, D.floor) : hi)) + '%"></span>' +
    mk(D.floor, 'f', t('bandFloor')) + mk(D.target, 't', t('bandTarget')) + (isFinite(D.ceil) ? mk(D.ceil, 'c', t('bandCeil')) : '') + mk(D.P, 'p', t('recPrice')) + '</div>';
  const li = a => a.map(x => '<li>' + esc(x) + '</li>').join('');
  const differs = !forPrint && D.k !== R.sel
    ? '<div class="dec-diff">' + svg('info', 'sm') + '<span>' + esc(t('differs', { a: t('m_' + R.sel + '_s'), b: t('m_' + D.k + '_s') })) + '</span><button class="btn primary" type="button" data-apply="' + D.k + '">' + svg('check', 'sm') + esc(t('applyRec')) + '</button></div>'
    : (forPrint && D.k !== R.sel ? '<div class="dec-diff">' + esc(t('differs', { a: t('m_' + R.sel + '_s'), b: t('m_' + D.k + '_s') })) + '</div>' : '');
  return '<div class="dec dec-' + D.verdict + '">' +
    '<div class="dec-verdict"><span class="dec-ic">' + svg(VERDICT_ICON[D.verdict], 'lg') + '</span><div><div class="dec-label">' + esc(t('decTitle')) + '</div><div class="dec-v">' + esc(t('v_' + D.verdict)) + '</div><p>' + esc(D.desc) + '</p></div></div>' +
    '<div class="dec-main"><div class="dec-label">' + esc(t(D.verdict === 'no' ? 'reqPrice' : 'recPrice')) + ' | ' + esc(t('m_' + D.k)) + '</div>' +
      '<div class="dec-price">' + money(D.P) + ' <small>' + esc(t('per', { u })) + '</small></div>' + band +
      '<dl class="dec-dl"><dt><i class="f"></i>' + esc(t('bandFloor')) + '</dt><dd>' + money(D.floor) + '</dd><dt><i class="t"></i>' + esc(t('bandTarget')) + '</dt><dd>' + money(D.target) + '</dd><dt><i class="c"></i>' + esc(t('bandCeil')) + '</dt><dd>' + (isFinite(D.ceil) ? money(D.ceil) : esc(t('notSet'))) + '</dd></dl></div>' +
    '<div class="dec-side"><div><div class="dec-label">' + esc(t('decWhy')) + '</div><ul>' + li(D.why) + '</ul></div><div><div class="dec-label">' + esc(t('decActions')) + '</div><ul>' + (D.actions.length ? li(D.actions) : '<li>' + esc(t('noActions')) + '</li>') + '</ul></div></div>' +
    differs + '</div>';
}

  const R = evaluate(mod, d, S.sliders, S.sel);
  LAST = R;
  const u = unitS(mod), us = unitsS(mod), per = periodS(mod);

  // KPI tiles
  const cm = R.net(R.P) - R.varUnit;
  const kpi = (ic, l, v, sub, cls) => '<div class="card kpi"><div class="k-top">' + svg(ic, 'sm') + '<span>' + l + '</span></div><div class="k-val ' + (cls || '') + '">' + v + '</div><div class="k-sub">' + sub + '</div></div>';
  $('kpis').innerHTML =
    kpi('layers', t('kpiUnitCost'), money(R.unit), t('atVolume', { v: volFmt(mod, R.V), u: us })) +
    kpi('tag', t('kpiPrice'), money(R.P), esc(t('m_' + R.sel + '_s')) + ' / ' + esc(u)) +
    kpi('trend', t('kpiProfit'), money(R.profit), esc(per), R.profit < 0 ? 'neg' : 'pos') +
    kpi('target', t('kpiBE'), isFinite(R.be) ? volFmt(mod, Math.ceil(R.be)) + ' <small style="font-size:12px;color:var(--ink-3)">' + esc(us) + '</small>' : t('notReached'),
      isFinite(R.be) ? t('safety', { p: pct(1 - R.be / R.V) }) : '-', !isFinite(R.be) || R.be > R.V ? 'neg' : '') +
    kpi('coins', t('kpiCM'), money(cm), pct(R.P > 0 ? cm / R.P : 0), cm < 0 ? 'neg' : '');

  // Decision panel
  const D = decide(R);
  $('decision').innerHTML = decisionHTML(R, D, false);

  // Pricing model cards
  $('models').innerHTML = MODEL_KEYS.map(k => {
    const P = R.prices[k], prof = R.profitAt(P, R.V), be = R.beAt(P), netv = R.net(P) * R.V;

const charts = { pie: null, line: null };
function lineSeries(R) {
  const maxBE = MODEL_KEYS.map(k => R.beAt(R.prices[k])).filter(isFinite);
  let xMax = Math.max(R.V * 2, ...maxBE.map(b => b * 1.25));
  xMax = Math.min(xMax, R.V * 4);
  const N = 20, xs = [];
  for (let i = 0; i <= N; i++) xs.push(xMax * i / N);
  return {
    xs,
    cost: xs.map(x => R.fixed + R.varUnit * x),
    models: MODEL_KEYS.map(k => ({ k, ys: xs.map(x => R.net(R.prices[k]) * x) }))
  };
}
function chartConfigs(R, theme, forPrint) {

        .concat(L.models.map(m => ({ label: t('revenueOf', { m: t('m_' + m.k + '_s') }), data: m.ys, borderColor: modelColor(m.k, theme), backgroundColor: modelColor(m.k, theme), borderWidth: m.k === R.sel ? 3 : 2, pointRadius: 0, pointHoverRadius: 4, tension: 0 })))
    },

        y: { ticks: { color: P.ink3, font, callback: v => moneyCompact(v) }, grid: { color: P.grid }, border: { color: P.axis } }

}
function legendsHTML(R, cfg) {

/* Built-in SVG fallback renderers (used offline or if Chart.js fails to load). */
function svgDonut(R, gt, theme, h) {
  const P = pal(theme), W = 320, cx = W / 2, cy = h / 2, r = Math.min(cx, cy) - 10, ir = r * 0.62;
  const total = gt.reduce((a, x) => a + x.v, 0) || 1;
  let a0 = -Math.PI / 2, paths = '';
  gt.forEach(x => {
    const a1 = a0 + x.v / total * Math.PI * 2 - 0.0001;
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const p = (ang, rad) => (cx + rad * Math.cos(ang)).toFixed(2) + ' ' + (cy + rad * Math.sin(ang)).toFixed(2);
    paths += '<path d="M' + p(a0, r) + ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + p(a1, r) + ' L' + p(a1, ir) + ' A' + ir + ' ' + ir + ' 0 ' + large + ' 0 ' + p(a0, ir) + 'Z" fill="' + groupColor(x.g, theme) + '" stroke="' + P.surface + '" stroke-width="2"><title>' + esc(t('g_' + x.g)) + ': ' + esc(money(x.v)) + ' (' + pct(x.v / total) + ')</title></path>';
    a0 = a1 + 0.0001;
  });
  return '<svg class="fallback" viewBox="0 0 ' + W + ' ' + h + '" role="img" aria-label="' + esc(t('chartBreak')) + '">' + paths +
    '<text x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle" font-size="18" font-weight="700" fill="' + P.ink + '">' + esc(money(R.unit)) + '</text>' +
    '<text x="' + cx + '" y="' + (cy + 16) + '" text-anchor="middle" font-size="11" fill="' + P.ink3 + '">' + esc(t('per', { u: unitS(R.mod) })) + '</text></svg>';
}
function svgLine(R, L, theme, h) {
  const P = pal(theme), W = 640, padL = 64, padR = 12, padT = 12, padB = 34;
  const all = L.cost.concat(...L.models.map(m => m.ys));
  const yMax = Math.max(...all) * 1.05 || 1, xMax = L.xs[L.xs.length - 1] || 1;
  const X = x => padL + (W - padL - padR) * x / xMax, Y = y => padT + (h - padT - padB) * (1 - y / yMax);
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const yv = yMax * i / 4, yy = Y(yv).toFixed(1);
    g += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + yy + '" y2="' + yy + '" stroke="' + P.grid + '"/><text x="' + (padL - 6) + '" y="' + yy + '" text-anchor="end" dominant-baseline="middle" font-size="10" fill="' + P.ink3 + '">' + esc(moneyCompact(yv)) + '</text>';
  }
  for (let i = 0; i <= 4; i++) { const xv = xMax * i / 4; g += '<text x="' + X(xv).toFixed(1) + '" y="' + (h - padB + 16) + '" text-anchor="middle" font-size="10" fill="' + P.ink3 + '">' + esc(volFmt(R.mod, xv)) + '</text>'; }
  const pl = (ys, color, w, dash) => '<polyline fill="none" stroke="' + color + '" stroke-width="' + w + '"' + (dash ? ' stroke-dasharray="6 4"' : '') + ' stroke-linejoin="round" points="' + ys.map((y, i) => X(L.xs[i]).toFixed(1) + ',' + Y(y).toFixed(1)).join(' ') + '"/>';
  let lines = pl(L.cost, P.ink3, 2, true);
  L.models.forEach(m => { lines += pl(m.ys, modelColor(m.k, theme), m.k === R.sel ? 3 : 2); });
  return '<svg class="fallback" viewBox="0 0 ' + W + ' ' + h + '" role="img" aria-label="' + esc(t('chartBE')) + '">' + g +
    '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + Y(0) + '" y2="' + Y(0) + '" stroke="' + P.axis + '"/>' + lines +
    '<text x="' + ((W + padL) / 2) + '" y="' + (h - 4) + '" text-anchor="middle" font-size="10.5" fill="' + P.ink2 + '">' + esc(t('volumeAxis', { u: unitsS(R.mod) })) + '</text></svg>';
}

/* ============================================================================
   SECTION L: SCENARIO MANAGER (save / load / delete / export / import)

function renderScenarioList(selectId) {
  const list = scenarios();
  const sel = $('scList');
  if (!list.length) { sel.innerHTML = '<option value="">' + esc(t('noScenarios')) + '</option>'; sel.disabled = true; return; }
  sel.disabled = false;
  sel.innerHTML = '<option value="">' + esc(t('chooseScenario')) + '</option>' + list
    .slice().sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0))
    .map(s => '<option value="' + esc(s.id) + '"' + (s.id === selectId ? ' selected' : '') + '>' + esc(s.name) + ' | ' + esc(MOD[s.module] ? t(MOD[s.module].l) : s.module) + ' | ' + esc(s.cur) + '</option>').join('');
}
function saveScenario() {
  if (!store.ok) return toast(t('toastStorage'), 'alert');
  const name = $('scName').value.trim();
  if (!name) { $('scName').focus(); return toast(t('toastNameReq'), 'info'); }
  const list = scenarios();
  const existing = list.find(s => s.name.toLowerCase() === name.toLowerCase() && s.module === S.module);
  if (existing && !confirm(t('confirmOverwrite', { n: name }))) return;
  const sc = {
    id: existing ? existing.id : 'sc_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name, module: S.module, cur: S.cur, sel: S.sel, sliders: Object.assign({}, S.sliders),
    data: JSON.parse(JSON.stringify(S.data[S.module])), savedAt: Date.now()
  };
  const next = existing ? list.map(s => (s.id === sc.id ? sc : s)) : list.concat(sc);
  if (!setScenarios(next)) return toast(t('toastStorage'), 'alert');
  S.name = name; persist();
  renderScenarioList(sc.id);
  toast(t('toastSaved', { n: name }), 'save');
}
function loadScenario() {
  const id = $('scList').value;
  const sc = scenarios().find(s => s.id === id);
  if (!sc) return toast(t('toastNoSel'), 'info');
  applyScenario(sc);
  toast(t('toastLoaded', { n: sc.name }), 'folder');
}
/** Loads a scenario; if it was saved in another currency its money values are converted. */
function applyScenario(sc) {
  const mod = MOD[sc.module]; if (!mod) return;
  const data = sanitizeData(mod, JSON.parse(JSON.stringify(sc.data)));
  if (sc.cur && sc.cur !== S.cur && FX[sc.cur]) {
    convertData(mod, data, sc.cur, S.cur);
    toast(t('toastFx', { a: sc.cur, b: S.cur }), 'coins');
  }
  S.data[mod.id] = data;
  S.module = mod.id;
  S.sel = MODEL_KEYS.includes(sc.sel) ? sc.sel : 'rec';
  S.sliders = Object.assign({}, SLIDERS0, sc.sliders || {});
  S.name = sc.name || '';
  $('scName').value = S.name;
  renderAll();
}
function deleteScenario() {
  const id = $('scList').value;
  const list = scenarios(), sc = list.find(s => s.id === id);
  if (!sc) return toast(t('toastNoSel'), 'info');
  if (!confirm(t('confirmDelete', { n: sc.name }))) return;
  setScenarios(list.filter(s => s.id !== id));
  renderScenarioList();
  toast(t('toastDeleted'), 'trash');
}
function exportJSON() {
  const payload = {
    app: 'universal-cost-pricing-engine', version: 1, exportedAt: new Date().toISOString(),
    current: { name: S.name || t('unsaved'), module: S.module, cur: S.cur, sel: S.sel, sliders: S.sliders, data: S.data[S.module] },
    scenarios: scenarios()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = URL.createObjectURL(blob);
  a.download = 'cost-pricing-scenarios-' + stamp + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(t('toastExported'), 'download');
}
function importJSON(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      let incoming = Array.isArray(obj) ? obj : (obj.scenarios || []);
      if (obj.current && obj.current.data && !Array.isArray(obj)) incoming = incoming.concat([Object.assign({ id: 'cur_' + Date.now().toString(36) }, obj.current, { name: (obj.current.name || 'Imported') })]);
      const valid = incoming.filter(s => s && MOD[s.module] && s.data && s.data.inputs && typeof s.name === 'string');
      if (!valid.length) throw new Error('empty');
      if (!store.ok) return toast(t('toastStorage'), 'alert');
      const list = scenarios(), ids = new Set(list.map(s => s.id));
      valid.forEach(s => {
        const copy = Object.assign({}, s, { savedAt: s.savedAt || Date.now() });
        if (!copy.id || ids.has(copy.id)) copy.id = 'sc_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        ids.add(copy.id); list.push(copy);
      });
      setScenarios(list);
      renderScenarioList();
      toast(t('toastImported', { n: valid.length }), 'upload');
    } catch (e) { toast(t('toastImportErr'), 'alert'); }
  };
  reader.readAsText(file);
}
